# cargo-fuzz crate for bins/inf-bench: every parser in `bins/` has a
# fuzz target. A workspace of its own, outside the root's, so its fuzzing
# features never unify into a shipping build; `just check` compiles its
# targets on the pinned toolchain and `cargo +nightly fuzz` runs them.
[package]
name = "inf-bench-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inf-foundation = { path = "../../../crates/inf-foundation" }


[[bin]]
name = "bench_resp_frame"
path = "fuzz_targets/bench_resp_frame.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "loop_histogram"
path = "fuzz_targets/loop_histogram.rs"
test = false
doc = false
bench = false
