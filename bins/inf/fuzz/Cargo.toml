# cargo-fuzz crate for bins/inf: every parser in `bins/` has a
# fuzz target. A workspace of its own, outside the root's, so its fuzzing
# features never unify into a shipping build; `just check` compiles its
# targets on the pinned toolchain and `cargo +nightly fuzz` runs them.
[package]
name = "inf-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"


[[bin]]
name = "cli_reply_parse"
path = "fuzz_targets/cli_reply_parse.rs"
test = false
doc = false
bench = false

[workspace]
