# cargo-fuzz crate for bins/inf-sim: every parser in `bins/` has a
# fuzz target. A workspace of its own, outside the root's, so its fuzzing
# features never unify into a shipping build; `just check` compiles its
# targets on the pinned toolchain and `cargo +nightly fuzz` runs them.
[package]
name = "inf-sim-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inf-sim = { path = "..", features = ["dst"] }

[[bin]]
name = "sim_resp_frame"
path = "fuzz_targets/sim_resp_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sim_resp_value"
path = "fuzz_targets/sim_resp_value.rs"
test = false
doc = false
bench = false

[workspace]
