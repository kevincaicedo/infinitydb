[package]
name = "inf-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Deterministic whole-node simulator (DST skeleton)"

[lib]
name = "inf_sim"
path = "src/lib.rs"

[[bin]]
name = "inf-sim"
path = "src/main.rs"

[features]
# ADR-0107 (review of 2026-08-30, F-L16-01 / P4): the DST's fault registry
# and the ADR-0094 D3 collision oracle are requested through THIS feature
# and never on the normal edge below. Cargo unifies normal-edge features
# across every package in one invocation, so the old
# `inf-foundation = { features = [...] }` line made `cargo build
# --workspace` link `infinityd` against a hasher with a constructible
# collision and a live fault registry. Off by default; every recipe that
# builds the simulator passes `-p inf-sim --features dst`, and `main`
# refuses to run without it (a plain-built sim would silently inject no
# faults). `scripts/check-shipping-features.sh` asserts the graph.
dst = ["inf-foundation/collision-oracle", "inf-foundation/fault-points"]

[dependencies]
inf-foundation.workspace = true
inf-alloc.workspace = true
inf-fabric.workspace = true
inf-runtime.workspace = true
inf-wire.workspace = true
inf-store.workspace = true
inf-server.workspace = true
# M2-S19 (ADR-0021): the durability oracle's survival audit replays the
# surviving disk image directly (manifest -> ick -> tail prefix) when a
# boot legally refuses — dep-DAG edge recorded.
inf-log.workspace = true
# M3-S23 (ADR-0045 D5): the replay-equivalence oracle's canonical
# comparator (`serialize_canonical_into`) and the fuzz-corpus loader's
# parse + canonical text — dep-DAG edge recorded.
inf-doc.workspace = true
libc.workspace = true

[lints]
workspace = true
