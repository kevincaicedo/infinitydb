[package]
name = "infinityd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "The InfinityDB node"

[dependencies]
inf-foundation.workspace = true
inf-alloc.workspace = true
inf-fabric.workspace = true
inf-runtime.workspace = true
inf-store.workspace = true
inf-server.workspace = true
# M4.5-S42 (ADR-0091): the in-boot device probe (`--device-probe auto`).
inf-probe.workspace = true

[features]
# M4.5-S37 step 1: the blind-overwrite ceiling instrument
# (`--blind-overwrite-ceiling`); unsound, never a shipping build.
bench-diagnostics = ["inf-server/bench-diagnostics"]

[target.'cfg(target_os = "linux")'.dependencies]
inf-runtime = { workspace = true, features = ["uring"] }

[lints]
workspace = true
