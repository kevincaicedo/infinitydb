# cargo-fuzz crate for bins/inf-compare. A workspace of its own, outside the
# root's, so its fuzzing features never unify into a shipping build;
# `just check` compiles its targets on the pinned toolchain and
# `cargo +nightly fuzz` runs them.
[package]
name = "inf-compare-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"


[[bin]]
name = "memtier_json_parse"
path = "fuzz_targets/memtier_json_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "compare_resp_frame"
path = "fuzz_targets/compare_resp_frame.rs"
test = false
doc = false
bench = false

[workspace]
