# cargo-nextest's rules for this workspace's tests (ADR-0200 D2). Under
# nextest every test is a process of its own, so a static lock in a test
# target no longer keeps that target's tests apart: the groups below do. Each
# lock in a test target carries a marker on the comment line above it, the
# group it needs (`nextest-group: <group>`) or why it guards a race between
# the threads of one process only (`nextest-in-process: <reason>`); a test
# target, or one test, that must run alone in its lane carries
# `nextest-alone: <reason, with its time in seconds>`.
# scripts/check-nextest-config.sh pairs every marker with its override here
# and refuses any key outside this file's list: the version floor, the leak
# rule, groups of one thread, and the two override shapes with their
# priorities. So no filter, retry or timeout setting can narrow or soften a
# run.
#
# Order matters. nextest queues tests by priority, then in list order, starts
# none past the first that does not fit, and takes each setting from the
# first override that matches a test. A test that runs alone needs every test
# slot; reached while a group's serial chain holds one, it would leave the
# lane idle until the chain ends. So each run-alone override sets priority 100
# and comes before every group's override, which sets 50: the run-alone tests
# run first, one at a time, before any chain starts.

# The oldest nextest these rules hold for. `cargo nextest show-config version`
# in `just check` exits non-zero below it, and CI installs exactly this
# version (ADR-0200 D4, D5).
nextest-version = { required = "0.9.150" }

[test-groups]
# The gate CLI's throughput fixtures: each reads a rate that a second fixture
# beside it would share the CPUs with.
gate-exit = { max-threads = 1 }
# The compatibility suite on one pinned Redis: its tests write, flush and
# count one shared keyspace.
compat-oracle = { max-threads = 1 }

[profile.default]
# A child that still holds a test's standard output or error 100 ms after the
# test ends fails the test (ADR-0200 D1): a test ends what it spawns.
leak-timeout = { period = "100ms", result = "fail" }

# Run alone, first: the user's pinned-memory budget is the verdict's subject.
[[profile.default.overrides]]
filter = 'binary_id(infinityd::memlock_boot)'
threads-required = "num-test-threads"
priority = 100

# Run alone, first: the verdict reads a live fixture's rate.
[[profile.default.overrides]]
filter = 'binary_id(inf-bench::gate_exit) & test(=m2_only_always_probes_and_enforces_measured_dispositions)'
threads-required = "num-test-threads"
priority = 100

# Run alone, first: the bound, two checkpoint waits and 2 s, is the subject.
[[profile.default.overrides]]
filter = 'binary_id(inf-server::node_e2e) & test(=a_checkpoint_holding_a_value_above_the_class_cap_completes)'
threads-required = "num-test-threads"
priority = 100

# Run alone, first: the verdict needs eight fill episodes in one 100 ms window.
[[profile.default.overrides]]
filter = 'binary_id(infinityd::timer_owners) & test(=a_burst_of_fill_episodes_leaves_one_fill_timer_per_cell)'
threads-required = "num-test-threads"
priority = 100

[[profile.default.overrides]]
filter = 'binary_id(inf-bench::gate_exit)'
test-group = "gate-exit"
priority = 50

[[profile.default.overrides]]
filter = 'package(compat)'
test-group = "compat-oracle"
priority = 50
