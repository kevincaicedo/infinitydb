# M1 exit gates (STOP) — machine-readable encoding of the M1 exit gates.
# Values are fixed by project decision; changing a threshold here is a
# recorded decision, not an edit (L10: a gate may not be passed by narrowing it).
#
# Consumed by `inf-bench gate-run m1`. Field semantics identical to
# m0-gates.toml: loadgen:* rows are measured natively by gate-run; external:*
# rows come from campaign tooling (compat suite, soak harness, zipfian trace
# replay, M0-baseline A/B, release pipeline) and remain unmeasured until supplied.
# Missing/non-finite selected STOP measurements fail in every tier (ADR-0132).
# Measured tier = "linux-reference-box" threshold verdicts bind
# only on the reference box (M0-R2 standing obligation).

schema = 1
milestone = "m1"

[[gate]]
id = "m0_regression"
name = "M0 gates re-pass within 5%"
threshold = 5
comparator = "<="
unit = "% vs M0 baseline"
tier = "linux-reference-box"
source = "external:m0_regression"
measured_by = "gate-run m0 on the M1 tree A/B vs the archived M0 baseline artifact, same box"

