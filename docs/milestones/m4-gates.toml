# M4 exit gates (STOP) — machine-readable encoding of the M4 milestone plan
# §7 (internal). Values are fixed by the project master plan §22 (M4,
# internal); changing a threshold here is a master-plan amendment, not an
# edit (L10: a gate may not be passed by narrowing it).
#
# This file is the single authority for the M4 gate values: it lives in
# this repository because `inf-bench` is its only consumer, and nothing in
# this workspace may resolve a path outside the checkout (the macOS/CI
# failure that forced the move — `bins/inf-bench/../../../docs/` does not
# exist on a runner that checks out this repo alone).
#
# Consumed by `inf-bench gate-run m4` and `inf-bench ycsb`. **Coverage
# (S22/S24): the full §7 table.** Rows whose producer cannot run yet render
# `PENDING (tooling)` in every report — a visible gap, never a passed gate:
# the tiered rows (hot-set split, cold p99, endurance) produce values only
# once command wiring (M4-S26) lifts the ADR-0062 D8 `USE` refusal, and the
# campaign-carried rows (recovery, M3 regression, DST/crash, foreground,
# endurance) bind through `gate-run m4` external-value flags that demand
# `--campaign-note` provenance (the M2-S22 pattern, L10).
#
# The §7 "Tripwires" gate is deliberately NOT a static row here: the S10
# cold tripwires (`cold_read_qd_p99`, `coalesce_ratio`) get their bound
# calibrated by S22 on the wired plane (ADR-0055 D2/D3); until then the
# §19 rule stands process-side — a cited run renders its tripwires in the
# report and a red tripwire invalidates the run by definition.
#
# tier = "linux-reference-box" verdicts bind only on the reference box;
# tier = "any" rows (the zero tripwires) bind on every box.

schema = 1
milestone = "m4"

[[gate]]
id = "degenerate_pipelined_ops"
name = "Degenerate A/B: pipelined ops regression"
threshold = 1.0
comparator = "<="
unit = "% vs M3 baseline"
tier = "linux-reference-box"
source = "ab:degenerate_pipelined_ops_delta_pct"
measured_by = "gate-run m4 ABBA row (M0 gate mix), median of replicates"

[[gate]]
id = "degenerate_pipelined_p999"
name = "Degenerate A/B: pipelined p99.9 regression"
threshold = 1.0
comparator = "<="
unit = "% vs M3 baseline (LogHistogram ~3% buckets: nonzero spans >= 1 bucket)"
tier = "linux-reference-box"
source = "ab:degenerate_pipelined_p999_delta_pct"
measured_by = "gate-run m4 ABBA row (M0 gate mix)"

[[gate]]
id = "degenerate_unpipelined_ops"
name = "Degenerate A/B: unpipelined ops regression"
