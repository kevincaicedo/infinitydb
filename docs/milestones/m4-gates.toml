measured_by = "gate-run m4 ABBA row (512-conn M0 gate mix)"

[[gate]]
id = "degenerate_unpipelined_p999"
name = "Degenerate A/B: unpipelined p99.9 regression"
threshold = 1.0
comparator = "<="
unit = "% vs M3 baseline"
tier = "linux-reference-box"
