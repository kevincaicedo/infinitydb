[[gate]]
id = "tiering_tables_zero"
name = "Memory-mode node constructs zero tiered tables"
threshold = 0
comparator = "<="
unit = "tables"
tier = "any"
source = "tripwire:tiering_tables"
measured_by = "INFO tiering scrape on the M4 leg after every row (abort on nonzero)"

[[gate]]
id = "tiering_counters_zero"
name = "Tiering code-path counters identically zero"
threshold = 0
comparator = "<="
unit = "counter sum"
tier = "any"
source = "tripwire:tiering_counter_total"
measured_by = "INFO tiering scrape on the M4 leg after every row (abort on nonzero — §3.3)"

[[gate]]
id = "write_amplification"
name = "Write amplification, worst tiered namespace"
# §7: "< 3x reported". The measured value is (wal_bytes + flush_bytes) /
# user_bytes for the worst namespace in the run — per namespace, never a
# node-wide blend, and never averaged over a namespace with no denominator
# (ADR-0060 D2/D4). `tier = "any"`: this is a ratio of counters, not a
# timing, so a breach is a breach on any box — what the reference box
# settles is the *workload*, not the arithmetic. Read it against the
# configured MAINTAIN slice and compaction dead-ratio (the S13 slice
# finding and the S16 steady-state finding: WA ~ wal/user + 1 + (1-t)/t).
threshold = 3.0
comparator = "<"
unit = "x user bytes (wal + flush)"
tier = "any"
source = "wa:write_amp_max"
measured_by = "gate-run m4: per-namespace INFO scrape recomputed by the harness; until a tiered namespace can be created on a live node (S19), supplied via --write-amp-milli with --campaign-note from `cargo test -p inf-store --test tiered_write_amp`"

[[gate]]
id = "mem_only_log_records"
name = "Memory-only rows append zero log records (M2 posture carried)"
threshold = 0
comparator = "<="
unit = "records"
tier = "any"
source = "tripwire:mem_only_log_records_appended"
measured_by = "INFO persistence scrape on the M4 leg after every row"

[[gate]]
id = "mixed_attribution"
name = "Mixed-node attribution divergence (M4-S20)"
# §7 memory-honesty extended over the coexistence audit: sum(domains) vs
# RSS throughout the mixed run — the 12 M2 domains plus the RSS-resident
# tiering terms (committed ring pages + tiered index; reserved VA is not
# resident and is excluded). `tier = "any"`: an attribution identity, not
# a timing. Worst continuous sample binds, not a hand-picked instant.
threshold = 10
comparator = "<="
unit = "pct, worst continuous sample"
tier = "any"
source = "mixed_attribution_divergence_pct"
measured_by = "inf-bench mixed-audit sampler (RSS 100 ms, domains ~1 s, all cells); joins gate-run via the S24 campaign"

[[gate]]
id = "cache_isolation_p99"
name = "Cache-namespace p99 isolation under the mixed node (M4-S20)"
# The §4.3 unified-profile promise: the cache namespace's p99 within 10%
# of its same-campaign solo baseline while the other namespaces serve.
# Until command wiring + S22 land the tiered leg, the mixed side is
# cache + document with the tiered namespace standing (budgets admitted,
# zero data traffic — the audit report names the absent leg); the full
# three-workload form binds at the S24 re-audit.
threshold = 10
comparator = "<="
unit = "pct vs same-campaign solo baseline"
tier = "linux-reference-box"
source = "cache_isolation_p99_delta_pct"
measured_by = "inf-bench mixed-audit solo/mixed legs, same box, same config, one campaign (§19)"

# ---------------------------------------------------------------------------
# §7 rows added with S22/S24 (2026-07-31). Producers named per row.
# ---------------------------------------------------------------------------

[[gate]]
id = "hot_set_p50"
name = "Hot set at memory speed: memory-hit p50 delta"
# §7: hot-set split percentiles within 10% of the identical workload on a
# memory-only namespace. S22 interpretation (recorded in the plan): the
# reference leg is the same workload through the SAME instrument on a
# fully-RAM-resident namespace (`ycsb --dataset-multiple 1`) — a service
# histogram on the memory-mode path would violate the S03 zero-cost
# contract, so "memory-only" means memory-resident, not memory-mode.
threshold = 10
comparator = "<="
unit = "pct vs RAM-resident reference leg, memory-hit split"
tier = "linux-reference-box"
source = "ycsb:hot_set_p50_delta_pct"
measured_by = "inf-bench ycsb tiered leg vs --dataset-multiple 1 reference leg, same campaign (blocked on M4-S26 wiring)"

[[gate]]
id = "hot_set_p99"
name = "Hot set at memory speed: memory-hit p99 delta"
threshold = 10
comparator = "<="
unit = "pct vs RAM-resident reference leg, memory-hit split"
tier = "linux-reference-box"
source = "ycsb:hot_set_p99_delta_pct"
measured_by = "inf-bench ycsb split histograms (blocked on M4-S26 wiring)"

[[gate]]
