[[gate]]
id = "degenerate_ttl_p999"
name = "Degenerate A/B: ttl-heavy p99.9 regression"
threshold = 1.0
comparator = "<="
unit = "% vs M3 baseline"
tier = "linux-reference-box"
source = "ab:degenerate_ttl_p999_delta_pct"
measured_by = "gate-run m4 ABBA row (M1 gate mix)"

[[gate]]
