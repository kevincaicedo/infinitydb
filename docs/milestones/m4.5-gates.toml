# M4.5 gate rows — machine-readable encoding of the M4.5 milestone plan's
# E4.5 performance stories. First occupant: the S29 tiered-`always`
# concurrency-scaling row (opened 2026-08-19, remediated same session —
# `reviews/tiered-always-group-commit-finding-20260819.md`). Second:
# the S27 durable-write-backpressure row (ADR-0083 D7 — refusals,
# decay, and max in the provoked `--log-staging-mib 1` regime; the
# ADR-0081 D5 bar restated for the gate harness, binding on the
# reference box).
#
# The S29 defect was a *slope* defect: tiered `always` flat at ~3.6k
# ops/s across an 8× concurrency range while non-tiered `always` scaled
# 3.9× for 4× conns on the same node/binary/device. These gates therefore
# bind on the slope and the tiered:flat parity ratio, never on a peak —
# a fix that raises a single point without restoring the slope has not
# addressed the defect (plan §5, M4.5-S29 pitfalls).
#
# Thresholds carry margin on both sides of the measured arms
# (pre-fix: slope 0.89×, parity@256 0.09×, p99 ratio ~40×;
# post-fix dev-tier medians: slope 3.9×, parity ~1.0×, p99 ratio ~1.0×).
# Changing a threshold here is a milestone-plan amendment, not an edit
# (L10: a gate may not be passed by narrowing it).
#
# Consumed by `inf-bench gate-run m4.5`.
# tier = "linux-reference-box" verdicts bind only on the reference box.

schema = 1

[[gate]]
id = "s29_tiered_scaling_slope"
name = "S29: tiered always scaling slope (c256/c64)"
threshold = 2.0
comparator = ">="
unit = "x (ops/s ratio across 4x conns)"
tier = "linux-reference-box"
source = "s29:tiered_scaling_slope_x"
measured_by = "gate-run m4.5 tiered-always-scaling row, median of replicates"

[[gate]]
id = "s29_tiered_flat_parity_c64"
name = "S29: tiered:flat always parity at 64 conns"
threshold = 0.7
comparator = ">="
unit = "x (tiered ops/s / flat ops/s, same node+session)"
tier = "linux-reference-box"
source = "s29:tiered_flat_ratio_c64"
measured_by = "gate-run m4.5 tiered-always-scaling row, median of replicates"

[[gate]]
id = "s29_tiered_flat_parity_c256"
name = "S29: tiered:flat always parity at 256 conns"
threshold = 0.7
comparator = ">="
unit = "x (tiered ops/s / flat ops/s, same node+session)"
tier = "linux-reference-box"
source = "s29:tiered_flat_ratio_c256"
measured_by = "gate-run m4.5 tiered-always-scaling row, median of replicates"

[[gate]]
id = "s29_tiered_p99_parity_c256"
name = "S29: tiered:flat always p99 ratio at 256 conns"
threshold = 4.0
comparator = "<="
unit = "x (tiered p99 / flat p99 — pre-fix read ~40x)"
tier = "linux-reference-box"
source = "s29:tiered_flat_p99_ratio_c256"
measured_by = "gate-run m4.5 tiered-always-scaling row, median of replicates"

[[gate]]
id = "s27_busy_refusals_pct"
name = "S27: client-visible -BUSY refusals under provoked staging pressure"
threshold = 0.05
comparator = "<="
unit = "% of operations (ADR-0081 D5: pacing, not refusal)"
tier = "linux-reference-box"
source = "s27:busy_refusals_pct"
measured_by = "gate-run m4.5 durable-write-backpressure row, both leg-sets (provoked --log-staging-mib 1 set + default-staging D5 set)"

[[gate]]
id = "s27_write_repeat_decay"
name = "S27: last:first throughput across back-to-back write repeats"
threshold = 0.90
comparator = ">="
unit = "x (the finding's signature was 2.4x monotonic decay)"
tier = "linux-reference-box"
source = "s27:write_repeat_decay_x"
measured_by = "gate-run m4.5 durable-write-backpressure row, default-staging D5 leg-set (ADR-0081 D5 shape)"

[[gate]]
id = "s27_max_latency_ms"
name = "S27: worst per-leg max latency at everysec under provoked pressure"
threshold = 50.0
comparator = "<="
unit = "ms (ADR-0081 D5: max <= 50 ms at everysec)"
tier = "linux-reference-box"
source = "s27:max_ms"
measured_by = "gate-run m4.5 durable-write-backpressure row, default-staging D5 leg-set (ADR-0081 D5 shape)"

# M4.5-S35 (ADR-0087 D8, 2026-08-21) — the frame-pipeline row. The
# hypothesis: with per-frame barriers (S34's FUA class) and K frames in
# flight, an `always` record waits ≤ one seal + one barrier instead of
# "two windows". Gated as the client p50 over the barrier the client
# actually waited on (write-through p50 under FUA, linked-fdatasync p50
# under FLUSH), at the 32-conn closed loop S33's bound-2 arm lost, and
# as the N-cell ÷ 1-cell p50 ratio (S34's F2 AC, owned by S35).
# Thresholds carry margin: the plan's "≤ 1.2 × barrier + loop overhead"
# is encoded as 1.3 (a 0.1-window allowance ≈ 60 µs at a 0.6 ms barrier
# — the reactor iteration + seal wait; K = 1 reads ~1.85, the preview's
# K = 3/2 MiB 1.18–1.24, K = 4 1.10–1.15); the ratio bar is the plan's.

[[gate]]
id = "s35_p50_over_barrier"
name = "S35: always p50 over the barrier p50 at 32 conns"
threshold = 1.3
comparator = "<="
unit = "x (client p50 / barrier p50; plan AC 1.2 + 0.1-window loop overhead — K = 1 reads ~1.85)"
tier = "linux-reference-box"
source = "s35:p50_over_barrier_x"
measured_by = "gate-run m4.5 frame-pipeline row, median of replicates, N cells, 32 conns closed-loop"

# Amended 2026-08-22 (ADR-0087 D8, third amendment — recorded before the
# rerun it governs): the F2 finding is a *barrier* contention term (fsync
# p50 1,535 µs at 1 cell → 2,751 at 4 under FLUSH — the device-wide flush
# unit), and the binding gate now measures it directly as the N-cell ÷
# 1-cell ratio of the barrier the clients waited on, per replicate. The
# client-p50 ratio stays on the row as an informational tripwire: at K ≥ 2
# it carries the pipeline's own seal wait (8 conns/cell at 2.2 acks per
# frame vs 32 conns on one cell at ~20 acks per frame — a different
# closed-loop shape per cell, ~0.2 × by structure) on top of the
# contention term, and with the 3 % client histogram it read 1.28 / 1.31 /
# 1.35 / 1.38 across four campaigns with the 4-cell p50 pinned — the
# denominator moving by one 16 µs bucket each time. Both ratios are
# medians of per-replicate ratios (interleaved legs), the client one on
# the 0.4 % instrument.

# Amended 2026-08-22 (ADR-0087 fourth amendment — the owner's K decision):
# campaign B read this ratio red at every K (K = 1 1.54, K = 3/2 1.35,
# K = 3/4 1.44) with the 4-cell barrier pinned at 591–623 µs and the
# 1-cell barrier moving with the queue depth one cell runs (qd1 383 µs at
# K = 1, qd3 423–463 at K = 3, 543–559 by drive state) — it measures the
# device's qd4-vs-qd1 FUA latency, which K does not control, and reads
# worst at the K it would select. A gate that cannot discriminate the
# quantity it decides binds nothing: informational, a device-
# characterization row (a FLUSH-class regression to ≈ 1.8 would still
# show on it). K is decided on s35_p50_over_barrier + the tail, read and
# throughput rules; the class-derived default is FUA → K = 3 / 4 MiB,
# FLUSH → K = 1 / 4 MiB (`--frames-in-flight auto`).

[[gate]]
id = "s35_multi_vs_one_cell_barrier"
name = "S35: N-cell vs 1-cell barrier p50 ratio (device characterization — informational since the ADR-0087 fourth amendment, 2026-08-22)"
threshold = 1.3
comparator = "<="
unit = "x (N-cell barrier p50 / 1-cell barrier p50 at 32 conns, per-replicate median; FLUSH read ~1.8, FUA read 1.35–1.54 at every K on 08-22 — qd4 vs qd1 on the device)"
tier = "linux-reference-box"
source = "s35:multi_vs_one_cell_barrier_x"
measured_by = "gate-run m4.5 frame-pipeline row, median of per-replicate ratios (1-cell leg interleaved)"
informational = true

[[gate]]
id = "s35_multi_vs_one_cell_p50"
name = "S35: N-cell vs 1-cell always client p50 ratio (informational since 2026-08-22 — carries the pipeline's seal wait at K ≥ 2)"
threshold = 1.3
comparator = "<="
unit = "x (N-cell p50 / 1-cell p50 at 32 conns, per-replicate median on the 0.4 % client histogram; FLUSH read 1.8, FUA K = 1 1.45, K = 3 1.25–1.38 on the 3 % instrument)"
tier = "linux-reference-box"
source = "s35:multi_vs_one_cell_p50_x"
measured_by = "gate-run m4.5 frame-pipeline row, median of per-replicate ratios (1-cell leg interleaved)"
informational = true

# M4.5-S36 (ADR-0088 D7/D9, 2026-08-21) — the device-budget row. The D2
# mechanism: the KV pure-write `everysec` row idled the engine at
# 123–185 % of 400 % CPU behind a buffered checkpoint and un-budgeted
# background I/O. Gated as the server's CPU across the closed-loop leg,
# the leg's throughput against a same-session tmpfs control (the
# device-free arm), the cell-scope write-amplification figure with
# checkpoints active (the plan's 1.5× is the checkpoint term alone —
# `(2D + D) / 2D`; v3 frame padding and framing at the 1 KiB/~50-record
# shape add ≈ 4 %, so the bar is 1.6 and the gate says so rather than
# reading a derived number as a measured one), and the S27 D5 `max` bar
# at a comparator-matched offered rate (ADR-0081 D5 was written for
# closed-loop saturation; the comparators were measured at an offered
# rate — the row discloses both and this gate binds on the latter).

[[gate]]
id = "s36_server_cpu_pct"
name = "S36: server CPU across the pure-write everysec leg"
threshold = 300.0
comparator = ">="
unit = "% of one core (400 = four cells flat out; pre-S36 read 123–185)"
tier = "linux-reference-box"
source = "s36:server_cpu_pct"
measured_by = "gate-run m4.5 device-budget row, /proc/<pid>/stat across the closed-loop device leg"

[[gate]]
id = "s36_everysec_vs_tmpfs"
name = "S36: everysec pure-write throughput vs the same-session tmpfs control"
threshold = 0.85
comparator = ">="
unit = "x (device arm ops/s / tmpfs control ops/s, same binary, same session)"
tier = "linux-reference-box"
source = "s36:everysec_vs_tmpfs_x"
measured_by = "gate-run m4.5 device-budget row, closed-loop legs on both roots"

# Amended 2026-08-21 with the first S36 campaign's evidence (L10 — the
# amendment is recorded in the plan's S36 section and ADR-0088 D9): the
# combined figure conflated the checkpoint term S36 owns with the v3
# frame padding S34 disclosed, and at the row's own shape (K = 3, 32
# conns, 2.2 records per 4 KiB frame) the padding alone is ~1.7×. The
# binding gate is now the checkpoint term over the log bytes (design
# bound 1/α = 500 milli; measured 140–170); the combined figure stays as
# an informational row with the padding share beside it.
[[gate]]
id = "s36_checkpoint_over_log_milli"
name = "S36: checkpoint + MANIFEST bytes over log frame bytes (the derived trigger's 1/α bound)"
threshold = 500.0
comparator = "<="
unit = "milli-x (ADR-0088 D4: interval = α × last checkpoint ⇒ checkpoint ≤ log / α; UNDEFINED until a checkpoint publishes)"
tier = "linux-reference-box"
source = "s36:checkpoint_over_log_milli"
measured_by = "gate-run m4.5 device-budget row, INFO persistence scrape at the end of the device leg (cells summed)"

[[gate]]
id = "s36_write_amp_milli_log_checkpoint"
name = "S36: log + checkpoint write amplification (informational — the padding term is shape-dependent)"
threshold = 1600.0
comparator = "<="
unit = "milli-x ((log frames + checkpoint + MANIFEST bytes) / encoded record bytes; log_padding_pct disclosed beside it)"
tier = "any"
informational = true
source = "s36:write_amp_milli_log_checkpoint"
measured_by = "gate-run m4.5 device-budget row, INFO persistence scrape at the end of the device leg (worst cell)"

[[gate]]
id = "s36_max_latency_ms_offered_rate"
name = "S36: everysec max latency at the comparator-matched offered rate (S27 D5)"
threshold = 50.0
comparator = "<="
unit = "ms (ADR-0081 D5 bar at an offered rate; latency from the intended send instant)"
tier = "linux-reference-box"
source = "s36:max_ms_offered_rate"
measured_by = "gate-run m4.5 device-budget row, offered-rate leg (--offered-ops, pipeline 16)"

# M4.5-S39b (ADR-0090 D6 as amended, 2026-08-22) — the segment-recycling
# row. The S35 shape (a flat `always` namespace, so zero-fill engages and
# the baseline's `zero_fill_bytes / log_frame_bytes` ≈ 1.0 — ADR-0088's
# recorded limitation 1), baseline `--no-segment-recycle` against the
# one-slot arm, interleaved per replicate (ABBA). Every counter is
# snapshotted twice — at the end of the first generation (every cell
# truncated ≥ 1 and rotated ≥ 2) and at the leg's end — and the warmed
# figures are **deltas** (A4). Binding: the warmed zero-fill share
# (falsifier (a) at > 0.3: the 1-slot bound starves), the per-cell
# recycle deficit (`rotations − recycled ≤ 2` over the warmed window),
# the padding control (S39c's term must not move — A1/D7), the `always`
# p50 / p99 and read ratios (falsifier (b)), the crash-restart recovery
# ratio (falsifier (c)), and the row's own validity (≥ 8 rotations per
# cell). Informational: host bytes per log byte (accounted: log +
# zero-fill + checkpoint + MANIFEST — A3) and the block device's sectors
# written per log byte (journal and metadata included, NAND not).

[[gate]]
id = "s39b_warmed_zero_fill_share"
name = "S39b: warmed zero-fill bytes per log frame byte under recycling (arm)"
threshold = 0.10
comparator = "<="
unit = "x (Δzero_fill_bytes / Δlog_frame_bytes after the first generation, per-replicate median; baseline ≈ 1.0; > 0.3 = falsifier (a))"
tier = "linux-reference-box"
source = "s39b:warmed_zero_fill_share_arm"
measured_by = "gate-run m4.5 --only-s39b, warmed window (end − first-generation snapshot), N cells, 32 conns closed-loop always"

[[gate]]
id = "s39b_recycle_deficit_per_cell"
name = "S39b: rotations not served by the pool over the warmed window, worst cell"
threshold = 2.0
comparator = "<="
unit = "segments (Δrotations − Δrecycled, worst cell, per-replicate median; ADR-0090 D6: recycled ≥ rotations − 2)"
tier = "linux-reference-box"
source = "s39b:recycle_deficit_per_cell"
measured_by = "gate-run m4.5 --only-s39b, warmed window"

[[gate]]
id = "s39b_padding_delta_pts"
name = "S39b: padding share moved by recycling (the S39c control)"
threshold = 3.0
comparator = "<="
unit = "percentage points (|arm − baseline| warmed log_padding_pct, per-replicate median; recycling must not touch the 2.2-record frame's block)"
tier = "linux-reference-box"
source = "s39b:padding_delta_pts"
measured_by = "gate-run m4.5 --only-s39b, warmed window"

[[gate]]
id = "s39b_always_c32_p50_x"
name = "S39b: always c32 p50 under recycling over baseline"
threshold = 1.05
comparator = "<="
unit = "x (arm / baseline, per-replicate median; falsifier (b): the rename or the residue read costs loop latency)"
tier = "linux-reference-box"
source = "s39b:always_c32_p50_x"
measured_by = "gate-run m4.5 --only-s39b, whole write leg"

[[gate]]
id = "s39b_always_c32_p99_x"
name = "S39b: always c32 p99 under recycling over baseline"
threshold = 1.10
comparator = "<="
unit = "x (arm / baseline, per-replicate median)"
tier = "linux-reference-box"
source = "s39b:always_c32_p99_x"
measured_by = "gate-run m4.5 --only-s39b, whole write leg"

[[gate]]
id = "s39b_read_c64p16_x"
name = "S39b: read leg under recycling over baseline (the E4.7 ±2 % rule)"
threshold = 0.98
comparator = ">="
unit = "x (arm / baseline GET ops/s at 64 conns × pipeline 16, per-replicate median)"
tier = "linux-reference-box"
source = "s39b:read_c64p16_x"
measured_by = "gate-run m4.5 --only-s39b, read leg after the write leg"

# Recovery is exactly one first boot per fresh crashed workload image. The
# image waits through `--leg-idle-s` without being opened, then the timer
# spans process launch through `loading:0`. Campaigns D/E timed a second
# boot after the first had already classified and cleaned the image; those
# recovery numbers are withdrawn and cannot bind this gate.
[[gate]]
id = "s39b_recovery_time_x"
name = "S39b: first crash-restart recovery boot on the recycled log over baseline"
threshold = 1.05
comparator = "<="
unit = "x (arm / baseline seconds from first process launch to loading:0 after SIGKILL and --leg-idle-s, per-replicate median; falsifier (c): the residue scan is not O(frame))"
tier = "linux-reference-box"
source = "s39b:recovery_time_x"
measured_by = "gate-run m4.5 --only-s39b, one first boot per fresh crashed image after the drive-state idle"

[[gate]]
id = "s39b_rotations_per_cell_min"
name = "S39b: rotations per cell the row actually performed (validity)"
threshold = 8.0
comparator = ">="
unit = "rotations (min over cells and arms, per-replicate min; ADR-0090 D6 asks ≥ 8)"
tier = "linux-reference-box"
source = "s39b:rotations_per_cell_min"
measured_by = "gate-run m4.5 --only-s39b"

# ADR-0090 D9 (A9, 2026-08-22): the pool wait's row reads the S39b row
# with `--s39b-baseline wait-off` (arm = one slot + `--recycle-wait
# quarter`, baseline = one slot + `--recycle-wait off`). The wait's
# outcome is a median; the three facts it must not move are worst-
# replicate maxima — one un-zeroed rotation is the falsifier, not a
# statistic. On a `recycle-off` row the arm also reports them.
[[gate]]
id = "s39b_wait_satisfied_share_arm"
name = "S39b/D9: pool waits fed before the bound over waits ended (arm)"
threshold = 0.5
comparator = ">="
unit = "share (Δrecycle_waits_satisfied / Δ(satisfied + expired), warmed; ADR-0090 A9: waits end predominantly satisfied; absent when no wait ended)"
tier = "linux-reference-box"
source = "s39b:wait_satisfied_share_arm"
measured_by = "gate-run m4.5 --only-s39b --s39b-baseline wait-off, warmed window"

[[gate]]
id = "s39b_rotations_unzeroed_arm_max"
name = "S39b/D9: rotations onto an un-zeroed segment on the arm, worst replicate"
threshold = 0.0
comparator = "<="
unit = "rotations (cumulative at leg end, summed over cells, max over replicates; ADR-0090 D9 falsifier: the deferred fill missed the rotation)"
tier = "linux-reference-box"
source = "s39b:rotations_unzeroed_arm_max"
measured_by = "gate-run m4.5 --only-s39b"

[[gate]]
id = "s39b_inline_preallocs_arm_max"
name = "S39b/D9: rotations that found no next segment on the arm, worst replicate"
threshold = 0.0
comparator = "<="
unit = "preallocs (cumulative at leg end, summed over cells, max over replicates; a blocking prealloc on the loop — the wait must never cause one)"
tier = "linux-reference-box"
source = "s39b:inline_preallocs_arm_max"
measured_by = "gate-run m4.5 --only-s39b"

[[gate]]
id = "s39b_prealloc_failures_arm_max"
name = "S39b/D9: preallocs refused for space on the arm, worst replicate"
threshold = 0.0
comparator = "<="
unit = "failures (cumulative at leg end, summed over cells, max over replicates; ENOSPC is discovered at the bound with 3/4 of the segment as headroom)"
tier = "linux-reference-box"
source = "s39b:prealloc_failures_arm_max"
measured_by = "gate-run m4.5 --only-s39b"

[[gate]]
id = "s39b_host_bytes_per_log_byte_arm"
name = "S39b: accounted host bytes per log frame byte under recycling (informational)"
threshold = 2.0
comparator = "<="
unit = "x (Δ(log + zero-fill + ckpt + MANIFEST) / Δlog_frame_bytes, warmed; baseline ≈ 2.2 with the zero-fill term)"
tier = "linux-reference-box"
source = "s39b:host_bytes_per_log_byte_arm"
measured_by = "gate-run m4.5 --only-s39b, warmed window"
informational = true

[[gate]]
id = "s39b_device_bytes_per_log_byte_arm"
name = "S39b: block-device sectors written per log frame byte under recycling (informational)"
threshold = 2.0
comparator = "<="
unit = "x (Δsectors_written × 512 / Δlog_frame_bytes, warmed; /sys/block/<dev>/stat — journal + metadata included, NAND amplification not)"
tier = "linux-reference-box"
source = "s39b:device_bytes_per_log_byte_arm"
measured_by = "gate-run m4.5 --only-s39b --device-stat <dev>, warmed window"
informational = true

# M4.5-S39d (ADR-0090 A10, 2026-08-22): recovery attribution on a
# fixed-work image — both arms receive the same records, the same
# `INF.CKPT WAIT` boundary, the same tail, one fresh SIGKILLed image, the
# same idle and exactly one boot; the engine reports the boot decomposed
# by phase (loop-clock time + bytes per phase). The total ratio is
# DIAGNOSTIC (informational): it names the phase to work on, it cannot
# turn recycling off by itself — only the absolute S18 gate re-read on the
# recycled log below can (the plan's S39d wording).
[[gate]]
id = "s39d_recovery_total_x"
name = "S39d: fixed-work first-boot recovery, slowest cell's engine total, arm over baseline"
threshold = 1.05
comparator = "<="
unit = "x (recover_total_us on the slowest cell, arm ÷ baseline, per-replicate median; diagnostic — the per-phase ratios name the term)"
tier = "linux-reference-box"
source = "s39d:recovery_total_x"
measured_by = "gate-run m4.5 --only-s39d, one first boot per fresh crashed fixed-work image after the drive-state idle"
informational = true

[[gate]]
id = "s39d_recovery_first_boot_s_arm"
name = "S39d: absolute first-boot recovery wall on the recycled log (the S18 < 15 s STOP gate re-read)"
threshold = 15.0
comparator = "<="
unit = "s (process launch to loading:0 on every cell, arm, per-replicate median; the dataset is the row's fixed work, disclosed in the report)"
tier = "linux-reference-box"
source = "s39d:recovery_first_boot_s_arm"
measured_by = "gate-run m4.5 --only-s39d"

[[gate]]
id = "s39d_records_recovered_match"
name = "S39d: both arms recovered exactly the records written (fixed-work validity)"
threshold = 1.0
comparator = ">="
unit = "1 = every replicate pair recovered warm + tail records on both arms, 0 = a pair did not (the row is then not fixed-work)"
tier = "linux-reference-box"
source = "s39d:records_recovered_match"
measured_by = "gate-run m4.5 --only-s39d, INFO recover_records summed over cells after loading:0"

[[gate]]
id = "s39d_phase_audit_x"
name = "S39d: slack-audit phase time over the cell sums, arm over baseline (the recycling term, informational)"
threshold = 1.5
comparator = "<="
unit = "x (Σcells recover_audit_us arm ÷ baseline, per-replicate median; residue is decoded and CRC-validated where zeros are skipped word-wise)"
tier = "linux-reference-box"
source = "s39d:phase_audit_x"
measured_by = "gate-run m4.5 --only-s39d"
informational = true

# M4.5-S40 (2026-08-22): the stall-attribution row — the memtier shape
# (1 M keys × 1 KiB, 32 conns, pipeline 1, everysec, 100 k offered) on the
# in-house generator with the server's counters and the block device
# sampled every 250 ms, so a client maximum is read against the window it
# fell in. The S27 D5 wording (`max ≤ 50 ms at everysec`) binds on the
# worst leg; the attribution word is a report note.
[[gate]]
id = "s40_max_ms_worst"
name = "S40: everysec max latency at the memtier shape, worst leg (S27 D5)"
threshold = 50.0
comparator = "<="
unit = "ms (client max from the intended send instant, 32 conns pipeline 1 at 100 k offered over 1 M keys, worst of --replicates legs)"
tier = "linux-reference-box"
source = "s40:max_ms_worst"
measured_by = "gate-run m4.5 --only-s40"

[[gate]]
id = "s40_offered_rate_achieved_x_min"
name = "S40: achieved over offered rate, worst leg (validity — a saturated leg's max is a saturation number)"
threshold = 0.9
comparator = ">="
unit = "x (achieved ops/s ÷ offered, min over legs)"
tier = "linux-reference-box"
source = "s40:offered_rate_achieved_x_min"
measured_by = "gate-run m4.5 --only-s40"

[[gate]]
