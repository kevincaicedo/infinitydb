# InfinityDB release pipeline (M1-S14): one tag push produces the whole
# release — linux x86-64/aarch64 static binaries, SHA256SUMS, SBOM, the
# multi-arch Docker image on GHCR (scanned), and a GitHub release that links
# the generated compat matrix and the claim ledger.
#
# Layout: the repository root IS the Cargo workspace (no nested `infinitydb/`
# directory). These jobs have not been exercised against a live runner yet —
# first run must verify the tag trigger, GHCR permissions, and the
# image-size/scan gates.
#
# The alpha tag itself stays gated on M0-R2 (reference box) per the master
# plan; this pipeline existing does not authorize tagging.
#
# REHEARSAL MODE (2026-08-17). Until now the only trigger was a tag push, so
# the pipeline could not be exercised without performing the release act it
# exists to perform — `gh workflow run infinity-release.yml` returned
# HTTP 422 ("Workflow does not have 'workflow_dispatch' trigger"), which is
# why readiness item 7 recorded it as never run while C9's image-size gate
# stayed unmeasured. `workflow_dispatch` now runs a NON-PUBLISHING rehearsal:
# it builds the binaries and the image, and runs the size gate, the
# out-of-the-box redis-cli smoke and the Trivy scan — but pushes nothing to
# GHCR and creates no release. The image is built for linux/amd64 only and
# `load`ed into the local daemon, because buildx cannot `load` a multi-arch
# manifest; the size gate measures a single arch either way (`docker image
# inspect` reports the pulled arch), so the number is the same one the tag
# path produces.
#
# What a rehearsal CANNOT verify, by construction: the tag trigger itself,
# GHCR push permission, and the draft-release step. Those are exercised only
# by a real `v*` tag push — either the release, or a throwaway pre-release
# tag deleted afterwards (note a GHCR image tag is public the moment it is
# pushed; the GitHub release is a draft and is not).
#
# On a tag push every step below behaves exactly as it did before this
# change: the rehearsal path is additive and gated on `publish == false`.
name: infinity-release

on:
  push:
    tags: ["v*"]
  # No inputs on purpose. A dispatch is ALWAYS a non-publishing rehearsal —
  # publishing keys on `github.event_name == 'push'` alone, so there is no
  # switch to get wrong and no checkbox implying there is one.
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/infinitydb

jobs:
  # Single source of truth for "what version is this" and "may this run
  # publish". Publishing is keyed on the EVENT, not on an input, so no
  # dispatch — however its boxes are ticked — can push to GHCR or cut a
  # release.
  meta:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.derive.outputs.version }}
      publish: ${{ steps.derive.outputs.publish }}
    steps:
      - id: derive
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${{ github.ref_name }}"
            publish=true
          else
            # Never borrow a real version string for a rehearsal: the run id
            # keeps it unique and obviously non-releasable.
            version="v0.0.0-rehearsal.${{ github.run_id }}"
            publish=false
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          {
            echo "### infinity-release"
            echo ""
            echo "- event: \`${{ github.event_name }}\`"
            echo "- version: \`$version\`"
            echo "- publish: \`$publish\`"
            if [ "$publish" != "true" ]; then
              echo ""
              echo "Rehearsal: nothing is pushed to GHCR and no release is created."
              echo "The tag trigger, GHCR push permission and the draft-release"
              echo "step are **not** covered by this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  binaries:
    needs: meta
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
      - name: build static binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p infinityd -p inf
          strip -s target/${{ matrix.target }}/release/infinityd target/${{ matrix.target }}/release/inf
        env:
          INF_RELEASE_VERSION: ${{ needs.meta.outputs.version }}
      - name: provenance check
        run: |
          out=$(target/${{ matrix.target }}/release/infinityd --version)
          echo "$out"
          echo "$out" | grep -F "${{ needs.meta.outputs.version }}"
      - name: package
        run: |
          name=infinitydb-${{ needs.meta.outputs.version }}-linux-${{ matrix.arch }}
          mkdir -p "dist/$name"
          cp target/${{ matrix.target }}/release/infinityd target/${{ matrix.target }}/release/inf "dist/$name/"
          cp docs/compat-matrix.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*.tar.gz

  docker:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Logging in on a rehearsal too: it is the cheapest check that the
      # GHCR credentials resolve at all. It does NOT prove push permission —
      # only a tag push does.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build + push multi-arch image
        if: needs.meta.outputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          build-args: |
            INF_RELEASE_VERSION=${{ needs.meta.outputs.version }}
            INF_GIT_SHA=${{ github.sha }}
      # Rehearsal: single-arch so buildx can `load` it (a multi-arch manifest
      # cannot be loaded into the docker daemon), and push disabled so the
      # rehearsal tag never reaches GHCR. Everything downstream — size gate,
      # smoke, scan — then runs against a local image by the same name.
      - name: build image locally (rehearsal, no push)
        if: needs.meta.outputs.publish != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          build-args: |
            INF_RELEASE_VERSION=${{ needs.meta.outputs.version }}
            INF_GIT_SHA=${{ github.sha }}
      - name: image size gate (< 10 MB)
        run: |
          # On a tag the image lives in GHCR and must be pulled back; on a
          # rehearsal it is already loaded in the local daemon.
          if [ "${{ needs.meta.outputs.publish }}" = "true" ]; then
            docker pull ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          fi
          size=$(docker image inspect ${{ env.IMAGE }}:${{ needs.meta.outputs.version }} --format '{{.Size}}')
          echo "image size: $size bytes"
          # 10 MB — owner decision 2026-08-08 (v0.4.0 readiness §9 D6);
          # matches m1-gates.toml image_size and the M1 §6 table.
          test "$size" -lt 10485760
      - name: smoke (redis-cli out of the box)
        run: |
          docker run -d --name inf -p 6399:6379 ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          sudo apt-get update && sudo apt-get install -y redis-tools
          for i in $(seq 1 50); do redis-cli -p 6399 PING && break || sleep 0.2; done
          test "$(redis-cli -p 6399 PING)" = "PONG"
          test "$(redis-cli -p 6399 SET k v)" = "OK"
          test "$(redis-cli -p 6399 GET k)" = "v"
          docker rm -f inf
      - name: image scan (release-blocking)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  sbom:
    needs: meta
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: infinitydb-${{ needs.meta.outputs.version }}.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: infinitydb-${{ needs.meta.outputs.version }}.spdx.json

  release:
    needs: [meta, binaries, docker, sbom]
    # The release act itself. Skipped on a rehearsal — the preceding jobs
    # still prove the artifacts build, the size gate holds, the image smokes
    # clean and the scan passes, which is what C9 needs.
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
      - name: create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
          body: |
            InfinityDB ${{ needs.meta.outputs.version }}

            - Docker: `docker run -p 6379:6379 ${{ env.IMAGE }}:${{ needs.meta.outputs.version }}`
            - Compat matrix: `docs/compat-matrix.md` (generated artifact, included in the tarballs)
            - Checksums: `SHA256SUMS`; SBOM: `infinitydb-${{ needs.meta.outputs.version }}.spdx.json`

            This is a draft. Release notes are written by the maintainer, and every
            performance or comparative claim is verified against the project's
            (internal) claim ledger before publishing — the draft flag is that gate.
