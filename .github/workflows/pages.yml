# InfinityDB website — GitHub Pages deployment.
#
# Guarantee enforced before every deploy: website/site is exactly what
# website/build.py renders from website/src and the generated
# docs/compat-matrix.md; the deploy fails when the committed site differs
# from a fresh build of those sources, and CI's compat-diff job fails when
# the matrix is stale against the registry and the corpus (L8).

name: website

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/compat-matrix.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a production deploy mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Site staleness gate (the committed site must match a fresh build)
        run: python3 website/build.py --check

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
