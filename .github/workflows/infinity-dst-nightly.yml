# InfinityDB nightly DST fleet (M1-S15): the simulator as a standing army.
#
# Every night: (1) 12k m2-durable + 4k m2-combined seeds sweep on the S14
# stall device (device-stall service time makes the group-commit / everysec
# pathologies sim-visible), (2) the curated seed corpus replays at full size,
# (3) a fleet of fresh m0/m1/boot-storm seeds (derived from the run id —
# recorded in the log, replayable verbatim) runs with determinism
# verification, (4) seeded 48 h virtual-time expiry campaigns push the
# simulated-seconds budget past the master-plan target (≥ 1M sim-seconds/
# night, §17.1). Oracles armed: per-key linearizability (model replay), TTL
# semantics, pub/sub delivery (confirmed ⇒ reachable, per-publisher FIFO,
# exact final ledger), accounting reconciliation at quiescence, §8.2 durable
# admissible-set + survival audit, everysec ack-deferral (M2.5-S14),
# L2 memory-volatility + log-scan (M2.5-S14), boot-storm fsync-free ready
# path (M2.5-S01).
#
# A failure auto-files an issue carrying the exact scenario + seed + commit
# (the determinism contract makes that a complete repro) and uploads the
# trace bundle as an artifact. Fixes land WITH the seed appended to
# bins/inf-sim/seeds/corpus.txt.
#
# NOTE: the repo root is the Cargo workspace; jobs run from the root. Not yet
# exercised against a live runner.
#
# Review 2026-08-30, F-L19-01/F-L19-02/F-L20-10 (ADR-0106 D6): a `run:`
# block with no `shell:` is `bash -e {0}` — no pipefail — so every
# `cmd | tee` step reported tee's status (0). `defaults.run.shell: bash`
# is GitHub's `bash --noprofile --norc -eo pipefail {0}`; on top of it,
# every multi-seed step keeps the explicit `if ! …; then fail=1` shape so
# one failing seed cannot abort the loop before the others ran. And every
# `sim_seconds=` line in /tmp/fleet.log is now emitted by the instrument
# that advanced the virtual clock — the workflow writes none itself.
name: infinity-dst-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

defaults:
  run:
    shell: bash

jobs:
  # M2-S17 (ADR-0020 D5): the kill-and-recover crash matrix with the
  # expanded seed set. The per-PR tier runs via `cargo test --workspace`
  # in infinity-ci on EVERY PR (strictly stronger than the plan's
  # "required on PRs touching inf-log"); the nightly hunts
  # seed-dependent states. Deterministic: the seed set is a fixed
  # superset of the PR set — any failure reproduces locally with the
  # same CRASH_MATRIX_SEEDS value (L7).
  crash-matrix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: crash matrix (expanded seeds)
        run: CRASH_MATRIX_SEEDS=256 cargo test -p crash-matrix -- --nocapture

  fleet:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: build (release)
        run: cargo build --release --bin inf-sim

      - name: durability sweep (M2-S19; M2.5-S14 raised to 12k on the stall device)
        run: |
          base=$(( ${{ github.run_id }} % 0xFFFFFFFF ))
          echo "durable sweep seed base: $base (run id ${{ github.run_id }})" | tee -a /tmp/fleet.log
          # 12,000 m2-durable seeds across 8 shards (≥ 10k, S14 budget). The
          # stall device (on by default in m2_durable) adds ~5–15%/seed; the
          # wider sharding offsets it. Determinism-verified per seed by the
          # runner's replay contract; any failing seed replays via --seed.
          for i in 0 1 2 3 4 5 6 7; do
            ./target/release/inf-sim --scenario m2-durable --sweep 12000 --seed "$base" \
              --shard "$i/8" --out /tmp/durable-sweep >> /tmp/fleet.log 2>&1 &
          done
          wait
          fail=0
          for i in 0 1 2 3 4 5 6 7; do
            grep -q " violations=0 " /tmp/durable-sweep/manifest-shard-$i.txt || {
              echo "durable sweep shard $i has violations" | tee -a /tmp/fleet.log
              grep VIOLATION /tmp/durable-sweep/results-shard-$i.txt | head -5 >> /tmp/failures.txt || true
              fail=1
            }
          done
          exit $fail

      - name: document sweep (M3-S23/S24 — power cuts + replay-equivalence oracle, ADR-0045)
        run: |
          base=$(( ${{ github.run_id }} % 0xFFFFFFFF ))
          echo "document sweep seed base: $base" | tee -a /tmp/fleet.log
          # 4,000 m3-document seeds nightly (heavier per seed than
          # m2-durable: merge-heavy workload + three equivalence checks);
          # the 10k gate-week sweep is `just doc-sweep`. The manifest also
          # discloses the cut-class distribution (ADR-0045 D4).
          for i in 0 1 2 3 4 5 6 7; do
            ./target/release/inf-sim --scenario m3-document --sweep 4000 --seed "$base" \
              --shard "$i/8" --out /tmp/document-sweep >> /tmp/fleet.log 2>&1 &
          done
          wait
          fail=0
          for i in 0 1 2 3 4 5 6 7; do
            grep -q " violations=0 " /tmp/document-sweep/manifest-shard-$i.txt || {
              echo "document sweep shard $i has violations" | tee -a /tmp/fleet.log
              grep VIOLATION /tmp/document-sweep/results-shard-$i.txt | head -5 >> /tmp/failures.txt || true
              fail=1
            }
          done
          cat /tmp/document-sweep/manifest-shard-*.txt | tee -a /tmp/fleet.log
          exit $fail

      - name: combined sweep (M2.5-S14 — durable+memory+pub/sub+expiry, L2 oracles)
        run: |
          base=$(( ${{ github.run_id }} % 0xFFFFFFFF ))
          echo "combined sweep seed base: $base" | tee -a /tmp/fleet.log
          for i in 0 1 2 3 4 5 6 7; do
            ./target/release/inf-sim --scenario m2-combined --sweep 4000 --seed "$base" \
              --shard "$i/8" --out /tmp/combined-sweep >> /tmp/fleet.log 2>&1 &
          done
          wait
          fail=0
          for i in 0 1 2 3 4 5 6 7; do
            grep -q " violations=0 " /tmp/combined-sweep/manifest-shard-$i.txt || {
              echo "combined sweep shard $i has violations" | tee -a /tmp/fleet.log
              grep VIOLATION /tmp/combined-sweep/results-shard-$i.txt | head -5 >> /tmp/failures.txt || true
              fail=1
            }
          done
          exit $fail

      - name: tiered command sweep (M4-S26 — the wired data plane under power cuts, drop races, DISKFULL)
        run: |
          base=$(( ${{ github.run_id }} % 0xFFFFFFFF ))
          echo "tiered sweep seed base: $base" | tee -a /tmp/fleet.log
          # 4,000 m4-tiered seeds nightly (~0.2 s/seed): the command-driven
          # tiered node — RESP through the sim net against the wired plane,
          # seeded cut → recovery → §8.2 command audit → re-pressure flush
          # liveness → DISKFULL clamp/reopen → the S19 drop race. The
          # manifest discloses demotion/cold/blob/refusal coverage.
          for i in 0 1 2 3 4 5 6 7; do
            ./target/release/inf-sim --scenario m4-tiered --sweep 4000 --seed "$base" \
              --shard "$i/8" --out /tmp/tiered-sweep >> /tmp/fleet.log 2>&1 &
          done
          wait
          fail=0
          for i in 0 1 2 3 4 5 6 7; do
            grep -q " violations=0 " /tmp/tiered-sweep/manifest-shard-$i.txt || {
              echo "tiered sweep shard $i has violations" | tee -a /tmp/fleet.log
              grep VIOLATION /tmp/tiered-sweep/results-shard-$i.txt | head -5 >> /tmp/failures.txt || true
              fail=1
            }
          done
          cat /tmp/tiered-sweep/manifest-shard-*.txt | tee -a /tmp/fleet.log
          exit $fail

      - name: corpus replay (full size)
        run: |
          # Review of 2026-08-30 (§5.5 "several gates cannot go red at
          # all"): the old `grep | while | tee` pipeline's status was
          # tee's, always 0 — a corpus divergence left the step green.
          # `if !` keeps the loop running past a failing seed (pipefail
          # + `-e` would abort at the first one); an empty corpus is red.
          fail=0
          ran=0
          while read -r scenario seed; do
            echo "== corpus: $scenario $seed =="
            ran=$((ran + 1))
            if ! ./target/release/inf-sim --scenario "$scenario" --seed "$seed" --verify-determinism \
                   | tee -a /tmp/fleet.log; then
              echo "$scenario $seed" >> /tmp/failures.txt
              fail=1
            fi
          done < <(grep -v '^#' bins/inf-sim/seeds/corpus.txt | grep -v '^$')
          [ "$ran" -gt 0 ] || { echo "corpus is empty — nothing replayed"; fail=1; }
          echo "corpus replay: $ran seeds"
          exit $fail

      - name: "fresh-seed fleet (replayable: seeds derive from the run id)"
        run: |
          base=$(( ${{ github.run_id }} % 0xFFFFFFFF ))
          echo "fleet seed base: $base (run id ${{ github.run_id }})" | tee -a /tmp/fleet.log
          fail=0
          for i in $(seq 0 24); do
            # boot-storm (M2.5-S14) joins the fresh-seed fleet — the wedge
            # oracle as a standing scenario, not just the corpus.
            for scenario in m0-smoke m1-cache boot-storm; do
              seed=$(( base + i * 7919 ))
              if ! ./target/release/inf-sim --scenario "$scenario" --seed "$seed" \
                     --verify-determinism --trace-out /tmp/last-trace.bin >> /tmp/fleet.log 2>&1; then
                echo "$scenario $seed" >> /tmp/failures.txt
                cp /tmp/last-trace.bin "/tmp/trace-$scenario-$seed.bin" || true
                fail=1
              fi
            done
          done
          exit $fail

      - name: seeded 48h expiry campaigns (6 × 48 h of virtual time, measured)
        run: |
          # F-L19-01/02: the campaign's verdict is the step's; the credit
          # is the test's own `expiry-campaign: sim_seconds=…` line —
          # printed only after every oracle held, carrying this seed and
          # `mode=full` — and the step asserts that exact line, so a
          # renamed or filtered-out test (cargo exits 0 on "0 passed")
          # earns nothing. `--exact` pins the name; `--nocapture` lets
          # the line reach the log.
          fail=0
          for i in $(seq 1 6); do
            seed=$(( ${{ github.run_id }} + i ))
            echo "== expiry campaign seed $seed ==" | tee -a /tmp/fleet.log
            if ! INF_DST_FULL=1 INF_DST_SEED=$seed \
                 cargo test --release -p inf-store --test expiry dst_virtual_time_48h_campaign \
                   -- --exact --nocapture 2>&1 | tee -a /tmp/fleet.log; then
              echo "expiry-campaign $seed" >> /tmp/failures.txt
              fail=1
            fi
            want="expiry-campaign: sim_seconds=[0-9][0-9.]* keys=10000000 seed=$(printf '0x%x' "$seed") mode=full"
            if ! grep -q "$want" /tmp/fleet.log; then
              echo "expiry campaign seed $seed left no measured sim_seconds line (did the test run?)"
              echo "expiry-campaign $seed (no evidence line)" >> /tmp/failures.txt
              fail=1
            fi
          done
          exit $fail

      - name: sim-seconds budget gate (≥ 1M, every line instrument-emitted)
        run: |
          # Every `sim_seconds=` line comes from inf-sim's virtual clock or
          # the expiry campaign's; the workflow writes none. An empty sum
          # is red, not zero.
          lines=$(grep -c 'sim_seconds=[0-9]' /tmp/fleet.log || true)
          total=$(grep -o 'sim_seconds=[0-9.]*' /tmp/fleet.log | cut -d= -f2 | paste -sd+ | bc)
          echo "total simulated seconds this night: ${total:-none} over $lines instrument lines"
          [ -n "$total" ] || { echo "no sim_seconds lines found"; exit 1; }
          awk -v t="$total" 'BEGIN { exit (t >= 1000000) ? 0 : 1 }'

      - name: upload trace bundles
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dst-failure-traces
          path: /tmp/trace-*.bin
          if-no-files-found: ignore

      - name: file the failure issue (seed = complete repro)
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body="Nightly DST fleet failed on commit ${{ github.sha }} (run ${{ github.run_id }}).

          Failing seeds (scenario seed):
          \`\`\`
          $(cat /tmp/failures.txt 2>/dev/null || echo 'see job log — failure outside the fresh-seed fleet')
          \`\`\`

          Repro: \`cargo run --release --bin inf-sim -- --scenario <scenario> --seed <seed>\`
          Trace bundles: this run's \`dst-failure-traces\` artifact.
          Contract: the fix lands WITH the seed appended to \`bins/inf-sim/seeds/corpus.txt\`."
          gh issue create \
            --title "DST nightly fleet failure ($(date -u +%F), run ${{ github.run_id }})" \
            --body "$body"
