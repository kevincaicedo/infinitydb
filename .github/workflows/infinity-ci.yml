# InfinityDB CI — pull-request lane (verification ladder, M0-S02).
#
# Layout: this repository's root IS the Cargo workspace (crates/, bins/,
# tests/ at the top level). Jobs run from the repo root; there is no nested
# `infinitydb/` directory on the runner.
#
# Split (2026-07-17): only the two slow jobs were the problem — `miri`
# (45-min timeout) and the 14-target `fuzz-smoke` (~70 min). Those are
# REDUCED here (a strict-provenance canary on inf-alloc, and a single 60-s
# fuzz smoke) and run in FULL in `infinity-ci-full.yml` (label `ci-full` /
# `/ci-full` comment / dispatch), together with the benchmark compile. Every
# other job — the full 3-OS build matrix, client-smoke, compat-diff,
# kernel-matrix, loom, sim-smoke — stays here: each runs in a few minutes and
# they run in parallel, so they cost little wall-clock but keep PR coverage.
name: infinity-ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: infinity-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: dep-DAG law
        run: ./scripts/check-dep-dag.sh
      - name: cell deny-list
        run: ./scripts/check-cell-denylist.sh
      - name: fault-point inventory (M2-S16)
        run: ./scripts/check-fault-points.sh
      - name: fsync fail-stop grep (M2-S17, §8.4)
        run: ./scripts/check-fsync-fail-stop.sh
      - name: panic-policy grep (M2.5-S13)
        run: ./scripts/check-panic-policy.sh
      - name: SAFETY.md inventory (M2.5-S16, §17.3)
        run: ./scripts/check-safety-inventory.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  miri-canary:
    # REDUCED: strict-provenance Miri on the smallest unsafe leaf (inf-alloc)
    # only. The FULL Miri (inf-alloc + inf-fabric, all tests) is the M0-S02
    # acceptance gate and runs in infinity-ci-full — that is the job that was
    # timing out at 45 min here.
    #
    # 2026-08-05 (ADR-0065 D5): inf-alloc alone then blew this budget too —
    # cancelled at 15 min with 14 of 31 tests done. Two causes, both fixed
    # rather than papered over with a bigger timeout:
    #   * the arena alloc/free storm verified every byte of every live range
    #     through an interpreted loop, and its rare size tier is half a
    #     megabyte — that ONE test measured > 7.4 min on the dev box. It now
    #     probes range ends under Miri (full width still runs natively).
    #   * the buffer-pool lease/release storm had no Miri guard at all
    #     (100k interpreted iterations); it scales down like the others.
    # `cargo miri setup` also rebuilds a Miri-instrumented std into
    # ~/.cache/miri on every cold run — cached below, since rust-cache does
    # not cover it by default.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: "~/.cache/miri"
          key: miri-canary
      - name: miri canary (inf-alloc, strict provenance)
        run: cargo +nightly miri test -p inf-alloc
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: loom model (SPSC ring)
        run: cargo test -p inf-fabric --release loom_ -- --nocapture
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  sim-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: sim tests (determinism, oracle, planted lost-wakeup)
        run: cargo test -p inf-sim
      - name: m0-smoke determinism (CLI)
        run: cargo run --release --bin inf-sim -- --scenario m0-smoke --seed 0xC0FFEE --verify-determinism

  fuzz-smoke:
    # REDUCED: one decoder, 60 s, to catch gross breakage fast. cargo-fuzz
    # auto-creates fuzz/corpus/resp_parse, so no seed dir is needed here. The
    # full 14-target smoke (300 s each) runs in infinity-ci-full.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz RESP parser (60 s smoke)
        run: cargo +nightly fuzz run resp_parse -- -max_total_time=60
        working-directory: crates/inf-wire

  compat-diff:
    # M0-S15 / M1-S14 / M3-S21: declared command x edge-case matrix
    # byte-identical to pinned Redis + RedisJSON oracles.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: start pinned oracle (redis 8.0.5, debug commands on, no persistence)
        run: |
          docker run -d --name oracle -p 6390:6379 redis:8.0.5 \
            redis-server --save '' --appendonly no --enable-debug-command yes
          for i in $(seq 1 100); do
            (echo PING | timeout 1 nc 127.0.0.1 6390 | grep -q PONG) && break || sleep 0.2
          done
      - name: start pinned RedisJSON oracle (Redis Stack 7.4.0-v8, ReJSON 2.8.9)
        run: |
          docker run -d --name json-oracle -p 6391:6379 \
            -e REDIS_ARGS="--save '' --appendonly no" \
            redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
          for i in $(seq 1 100); do
            oracle_info=$(printf 'INFO MODULES\r\n' | timeout 1 nc 127.0.0.1 6391 || true)
            if grep -q 'module:name=ReJSON' <<<"$oracle_info" && grep -q 'ver=20809' <<<"$oracle_info"; then
              break
            fi
            sleep 0.2
          done
          grep -q 'module:name=ReJSON' <<<"$oracle_info"
          grep -q 'ver=20809' <<<"$oracle_info"
      - name: compat-diff matrix + generated-matrix staleness gate
        run: cargo test -p compat -- --nocapture
        env:
          INF_COMPAT_ORACLE_ADDR: 127.0.0.1:6390
          INF_COMPAT_JSON_ORACLE_ADDR: 127.0.0.1:6391

  client-smoke:
    # M1-S03/S14: major Redis client libraries work against infinityd out of
    # the box. One server serves all four sequentially. Fast (~1-2 min).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: build infinityd (release)
        run: cargo build --release -p infinityd
      - name: start infinityd
        run: |
          ./target/release/infinityd --port 6379 &
          ready=0
          for i in $(seq 1 100); do
            if printf '*1\r\n$4\r\nPING\r\n' | timeout 1 nc 127.0.0.1 6379 | grep -q PONG; then
              ready=1; break
            fi
            sleep 0.2
          done
          test "$ready" = 1 || { echo "infinityd never answered PING"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: redis-py smoke
        timeout-minutes: 5
        run: |
          pip install 'redis>=5,<7'
          python tests/client-smoke/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node-redis smoke
        timeout-minutes: 5
        run: |
          npm install --no-save redis@^4
          node smoke.mjs
        working-directory: tests/client-smoke
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go-redis smoke
        timeout-minutes: 5
        run: go mod tidy && go run .
        working-directory: tests/client-smoke/go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: lettuce smoke
        timeout-minutes: 10
        run: mvn -q -B compile exec:java -Dexec.mainClass=Smoke
        working-directory: tests/client-smoke/java

  kernel-matrix:
    # io_uring feature-probe fallback across kernels (M0-S02). Fast.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: uring suite, probed features
        run: cargo test -p inf-runtime --features uring
      - name: uring suite, forced-degraded (oneshot recv, no provided buffers)
        run: cargo test -p inf-runtime --features uring
        env:
          INF_URING_FORCE_DEGRADED: "1"

  website-gates:
    # M2.5-S05 gates, moved into the PR lane (2026-08-08).
    #
    # These two checks previously ran ONLY in `pages.yml`, which triggers on
    # push-to-main. A PR that regenerated docs/compat-matrix.md therefore
    # passed review and merged green, and the drift only surfaced afterwards
    # as a failed production deploy (PR #2 → website run #1). The same gates
    # run here, on the PR, where the fix is a one-line regeneration commit.
    #
    # Cheap by construction: stdlib python3, no toolchain, no build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: workflow YAML lint
        # A syntactically invalid workflow is otherwise only discovered when
        # its schedule fires (infinity-dst-nightly carried an unquoted colon
        # in a step name for a full nightly cycle). Parse every workflow here.
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"ok   {p}")
              except yaml.YAMLError as e:
                  print(f"::error file={p}::invalid workflow YAML: {e}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: regenerate compat page from the repo artifact
        run: |
          python3 website/scripts/gen-compat-page.py \
            --matrix docs/compat-matrix.md \
            --out website/site/docs/compat.html \
            --date "$(date -u +%F)"

      - name: compat page staleness gate (generated page must be committed)
        run: |
          # The --date stamp is the only line allowed to differ.
          if ! git diff -I'gen-compat-page\.py</code> on [0-9-]*\.' --exit-code website/site/docs/compat.html; then
            echo "::error::website/site/docs/compat.html is stale — regenerate it with website/scripts/gen-compat-page.py and commit."
            exit 1
          fi

      - name: ledger-copy check (no number without an Allowed row)
        run: |
          python3 website/scripts/check-ledger-copy.py \
            --site website/site \
            --ledger website/site/_ledger-snapshot.md \
            --allowlist website/scripts/ledger-allowed-numbers.txt \
            --print-tokens
