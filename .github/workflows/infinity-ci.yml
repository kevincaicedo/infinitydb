# InfinityDB CI — pull-request lane (the verification ladder).
#
# Layout: this repository's root IS the Cargo workspace (crates/, bins/,
# tests/ at the top level). Jobs run from the repo root; there is no nested
# `infinitydb/` directory on the runner.
#
# The two slow suites run REDUCED here and in FULL in `infinity-ci-full.yml`
# (main pushes / weekly / label `ci-full` / `/ci-full` comment / dispatch):
# Miri as a strict-provenance canary on inf-alloc, and the fuzz smoke as one
# target, `resp_parse`, for 60 s, while `build-test` compiles every fuzz
# target on each of its legs (ADR-0198 D2, D3). Benchmark sanity also runs on
# every PR. Every other job — the full 3-OS build matrix, client-smoke,
# compat-diff, kernel-matrix, loom, sim-smoke — stays here: each runs in a few
# minutes and they run in parallel, so they cost little wall-clock but keep
# PR coverage.
name: infinity-ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: infinity-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      # ADR-0144 D3: the lint gates compare their tables with approved
      # copies in history (HEAD, the base branch tip, the introducing
      # commit) — a shallow clone makes the base tip unresolvable, which
      # the gate reports as a scope error, never a skip.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: documentation identities and relative links (ADR-0106 D15, ADR-0166 D5)
        run: ./scripts/check-doc-artifacts.sh
      - name: dep-DAG law
        run: ./scripts/check-dep-dag.sh
      - name: cell deny-list
        run: ./scripts/check-cell-denylist.sh
      - name: fault-point inventory
        run: ./scripts/check-fault-points.sh
      - name: fsync fail-stop grep
        run: ./scripts/check-fsync-fail-stop.sh
      - name: panic-policy grep
        run: ./scripts/check-panic-policy.sh
      # ADR-0190 D4: a reply's outcome is read beside its bytes, never from them.
      - name: reply-outcome gate (ADR-0190 D4)
        run: ./scripts/check-reply-outcome.sh
      # ADR-0107 D2: release asserts justified by a claim about a caller are
      # an inventory, gated.
      - name: release-assert inventory (ADR-0107 D2)
        run: ./scripts/check-release-asserts.sh
      - name: SAFETY.md inventory
        run: ./scripts/check-safety-inventory.sh
      # ADR-0107 D1: the DST features never ride a normal dependency edge,
      # or `cargo build --workspace` would link infinityd against a
      # colliding hasher.
      - name: shipping-feature fence (ADR-0107)
        run: ./scripts/check-shipping-features.sh
      # ADR-0198 D2: every fuzz target compiles, warnings denied, under its
      # committed lock and cfg(fuzzing), on each leg's own cfg; the probe's
      # planted reds run first, so the gate proves it can see what it guards.
      - name: fuzz targets compile (ADR-0198)
        run: ./scripts/check-fuzz-targets.sh
      # ADR-0106 D7: the clock ban is type-resolved; the gate compiles a
      # planted-bypass probe under the workspace clippy.toml and lists every
      # sanctioned site.
      - name: clock ban (type-resolved, planted-bypass probe)
        run: ./scripts/check-clock-ban.sh
      # ADR-0106 D8, ADR-0003: no atomics in the waker path, read from the
      # bodies each waker's vtable reaches, against a planted-bypass probe.
      # Linux only: the Mach-O asm flavor is handled but unverified, and an
      # unverified red on one leg would be noise, not evidence.
      - name: waker-atomics (vtable-resolved, planted-bypass probe)
        if: runner.os == 'Linux'
        run: ./scripts/check-waker-atomics.sh
      # ADR-0144: crate roots under the wildcard deny, the structural
      # suppression audit, the frozen ADR-0143 exemptions, and the probe
      # whose plants must draw their lint.
      - name: lint scopes (ADR-0144)
        run: ./scripts/check-lint-scopes.sh
      # Linux only: the baseline is recorded there (cfg-gated files). Its two
      # clippy passes keep their own target, target/lint-ratchet-<key>, the key
      # this checkout's (scripts/target-root.sh): in the target the clippy step
      # uses, their lint arguments would re-check every member twice.
      - name: lint ratchet (ADR-0144 D3; absorbs the fn-length ratchet)
        if: runner.os == 'Linux'
        run: ./scripts/check-lint-ratchet.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # ADR-0106: the gates must go red on a planted violation, or their OK
      # is a claim. It runs after clippy, so a compile or lint red stops the
      # leg first.
      - name: check scripts self-test (each gate exits non-zero on its planted case)
        run: ./scripts/check-scripts-selftest.sh
      - name: build shipping packages
        run: cargo build --workspace --exclude inf-sim
      - name: build simulator (isolated DST features)
        run: cargo build -p inf-sim --features dst
      - name: test (compat runs with its pinned oracles in compat-diff)
        run: cargo test --workspace --exclude compat
        env:
          # memlock_boot may skip only where rings are not charged to
          # RLIMIT_MEMLOCK; on the Linux legs a skip is a failure.
          INF_MEMLOCK_BOOT_REQUIRE: ${{ runner.os == 'Linux' && '1' || '0' }}

  slim-build:
    # L11: workspace feature unification hides missing doc guards, so the
    # slim packages build alone, without their default features.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: slim-build
      - name: slim clippy
        run: cargo clippy -p inf-server -p inf-store --no-default-features -- -D warnings
      - name: slim libraries
        run: cargo build -p inf-server -p inf-store --no-default-features
      - name: slim symbols exclude document and query engines
        shell: bash
        run: |
          mkdir -p .artifacts/slim-build
          nm -C --defined-only target/debug/libinf_server.rlib target/debug/libinf_store.rlib > .artifacts/slim-build/symbols.txt
          cargo tree -p inf-server -p inf-store --no-default-features -e normal,build > .artifacts/slim-build/dependencies.txt
          grep -q 'inf_server::' .artifacts/slim-build/symbols.txt
          grep -q 'inf_store::' .artifacts/slim-build/symbols.txt
          if grep -E 'inf_(doc|query)::|inf-(doc|query) v' .artifacts/slim-build/{symbols,dependencies}.txt; then
            echo '::error::slim libraries include a document or query engine'
            exit 1
          fi
      - name: slim tests
        run: cargo test -p inf-server -p inf-store --no-default-features

  doc-intern-keys:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: doc-intern-keys
      - name: interned document clippy
        run: cargo clippy -p inf-doc -p inf-store --all-targets --features doc-intern-keys -- -D warnings
      - name: interned document tests
        run: cargo test -p inf-doc -p inf-store --features doc-intern-keys

  benchmark-sanity:
    # Correctness and compilation only; hosted runners do not prove perf gates.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: benchmark-sanity
      - name: benchmark instrument tests (release)
        run: cargo test --release -p inf-bench -p inf-compare
      - name: criterion benches compile (no measurements)
        run: cargo bench --workspace --no-run

  deny-manifests:
    # The manifests cargo-deny reads, from the fuzz census (ADR-0198 D6): the
    # root and every fuzz manifest, each a workspace with a lock of its own.
    # The census runs before any toolchain is installed. A red census fails
    # this step before its output is written, so no cargo-deny job runs on a
    # partial list, and the census never prints an empty one.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.census.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: the manifests cargo-deny reads
        id: census
        shell: bash
        run: |
          matrix=$(./scripts/check-fuzz-targets.sh --matrix deny)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  cargo-deny:
    # Licences, advisories, bans and sources of every lock that holds a
    # third-party crate, the root's and each fuzz manifest's, one job a
    # manifest; a probe names none, which the census checks. build-test
    # compiles every fuzz target, so a fuzz lock's crates (libfuzzer-sys,
    # and the cc its build script runs) are built on every PR leg.
    needs: deny-manifests
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.deny-manifests.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: ${{ matrix.manifest }}

  miri-canary:
    # REDUCED: strict-provenance Miri on the smallest unsafe leaf (inf-alloc)
    # only, inside a PR job's timeout. The FULL Miri (inf-alloc + inf-fabric,
    # all tests) runs longer than that, in infinity-ci-full.
    #
    # ADR-0065 D5: the budget holds by scaling the storms under Miri, not by
    # a bigger timeout. The arena alloc/free storm probes each live range's
    # ends under Miri, where checking every byte through the interpreter
    # would take minutes (its rare size tier is half a megabyte), and the
    # full width still runs natively; the buffer-pool lease/release storm
    # runs fewer iterations under Miri, as the others do.
    # `cargo miri setup` also rebuilds a Miri-instrumented std into
    # ~/.cache/miri on every cold run — cached below, since rust-cache does
    # not cover it by default.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: "~/.cache/miri"
          key: miri-canary
      - name: miri canary (inf-alloc, strict provenance)
        run: cargo +nightly miri test -p inf-alloc
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: loom model (SPSC ring)
        run: cargo test -p inf-fabric --release loom_ -- --nocapture
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  sim-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: sim tests (determinism, oracle, planted lost-wakeup)
        run: cargo test -p inf-sim --features dst
      # The job is named after the recipe it runs — every scenario in
      # `inf_sim::SCENARIOS` once at a fixed seed, determinism-verified
      # (`scripts/sim-smoke.sh` is the one registry;
      # `bins/inf-sim/tests/lanes.rs` keeps it complete).
      - name: every scenario once (scripts/sim-smoke.sh)
        run: ./scripts/sim-smoke.sh

  fuzz-smoke:
    # REDUCED (ADR-0198 D3): one target, `resp_parse`, for 60 s, the first
    # decoder every client byte crosses; `build-test` compiles every target
    # and the full smoke runs in infinity-ci-full. cargo-fuzz creates the
    # default corpus directory, fuzz/corpus/resp_parse, so no seed directory
    # is named here.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz RESP parser (60 s smoke)
        run: cargo +nightly fuzz run resp_parse -- -max_total_time=60
        working-directory: crates/inf-wire

  compat-diff:
    # The declared command x edge-case corpus against the pinned Redis and
    # RedisJSON oracles: a compared case whose reply differs with no
    # recorded deviation for it fails the job, and so does a stale
    # generated matrix.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: start pinned oracle (redis 8.0.5, debug commands on, no persistence)
        run: |
          docker run -d --name oracle -p 6390:6379 redis:8.0.5 \
            redis-server --save '' --appendonly no --enable-debug-command yes
          for i in $(seq 1 100); do
            (echo PING | timeout 1 nc 127.0.0.1 6390 | grep -q PONG) && break || sleep 0.2
          done
      - name: start pinned RedisJSON oracle (Redis Stack 7.4.0-v8, ReJSON 2.8.9)
        run: |
          docker run -d --name json-oracle -p 6391:6379 \
            -e REDIS_ARGS="--save '' --appendonly no" \
            redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
          for i in $(seq 1 100); do
            oracle_info=$(printf 'INFO MODULES\r\n' | timeout 1 nc 127.0.0.1 6391 || true)
            if grep -q 'module:name=ReJSON' <<<"$oracle_info" && grep -q 'ver=20809' <<<"$oracle_info"; then
              break
            fi
            sleep 0.2
          done
          grep -q 'module:name=ReJSON' <<<"$oracle_info"
          grep -q 'ver=20809' <<<"$oracle_info"
      - name: build infinityd (the real-node compat candidate)
        run: cargo build -p infinityd
      - name: compat-diff matrix + generated-matrix staleness gate
        run: cargo test -p compat -- --nocapture
        env:
          INF_COMPAT_ORACLE_ADDR: 127.0.0.1:6390
          INF_COMPAT_JSON_ORACLE_ADDR: 127.0.0.1:6391
          INFINITYD_BIN: ${{ github.workspace }}/target/debug/infinityd
          INF_COMPAT_REQUIRE_BINARY: '1'

  client-smoke:
    # Major Redis client libraries work against infinityd out of the box.
    # One server serves all four sequentially. Fast (~1-2 min).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: build infinityd (release)
        run: cargo build --release -p infinityd
      # A debug cell reaches its first command after its clock's first
      # millisecond, so this binary test can see a pre-origin deadline served
      # there only on a release build (the in-process held-clock test pins the
      # same read in every build).
      - name: pre-origin deadline sent at connect (release infinityd)
        run: cargo test --release -p infinityd --test pre_origin_deadline
      - name: start infinityd
        run: |
          ./target/release/infinityd --port 6379 &
          ready=0
          for i in $(seq 1 100); do
            if printf '*1\r\n$4\r\nPING\r\n' | timeout 1 nc 127.0.0.1 6379 | grep -q PONG; then
              ready=1; break
            fi
            sleep 0.2
          done
          test "$ready" = 1 || { echo "infinityd never answered PING"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: redis-py smoke
        timeout-minutes: 5
        run: |
          pip install 'redis>=5,<7'
          python tests/client-smoke/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node-redis smoke
        timeout-minutes: 5
        run: |
          npm install --no-save redis@^4
          node smoke.mjs
        working-directory: tests/client-smoke
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go-redis smoke
        timeout-minutes: 5
        run: go mod tidy && go run .
        working-directory: tests/client-smoke/go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: lettuce smoke
        timeout-minutes: 10
        run: mvn -q -B compile exec:java -Dexec.mainClass=Smoke
        working-directory: tests/client-smoke/java

  kernel-matrix:
    # The io_uring suite on the features the runner's kernel offers, then
    # forced onto the degraded fallback an older kernel takes (oneshot recv,
    # no provided buffers). Fast.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: uring suite, probed features
        run: cargo test -p inf-runtime --features uring
      - name: uring suite, forced-degraded (oneshot recv, no provided buffers)
        run: cargo test -p inf-runtime --features uring
        env:
          INF_URING_FORCE_DEGRADED: "1"

  website-gates:
    # Gates that need no toolchain, on the PR: every workflow's YAML, and
    # the committed site against a fresh build. `pages.yml` checks the site
    # on a push to main that matches its `paths:` filter (the site's sources
    # and the workflow itself) or on a manual dispatch, never on a PR, so a
    # site stale against its sources fails the deploy after the merge; here
    # it fails the PR, where the fix is a one-line regeneration commit.
    #
    # Cheap by construction: python3 and the runner image's PyYAML, no
    # toolchain, no build.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: workflow YAML lint
        # A syntactically invalid workflow is otherwise only discovered when
        # its schedule fires, so every workflow is parsed here.
        run: |
          python3 - <<'PY'
          import pathlib, sys, yaml
          bad = 0
          for p in sorted(pathlib.Path(".github/workflows").glob("*.yml")):
              try:
                  yaml.safe_load(p.read_text())
                  print(f"ok   {p}")
              except yaml.YAMLError as e:
                  print(f"::error file={p}::invalid workflow YAML: {e}")
                  bad = 1
          sys.exit(bad)
          PY

      - name: website staleness gate (the committed site must match a fresh build)
        # website/build.py renders website/site from website/src and the
        # generated docs/compat-matrix.md; --check fails on any drift.
        run: python3 website/build.py --check
