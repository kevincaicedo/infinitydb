# InfinityDB CI — M0-S02 verification-ladder scaffolding.
#
# Layout: this repository's root IS the Cargo workspace (crates/, bins/,
# tests/ at the top level). Jobs run from the repo root; there is no nested
# `infinitydb/` directory on the runner.
#
# NOTE (Linux validation pending): the Linux jobs (io_uring suite, kernel
# matrix, Miri) and the fuzz smoke have not been exercised against a live
# runner yet. First Linux run must verify: io_uring feature probes on 5.15 vs
# 6.1, Miri canary (M0-S02 AC), and the fuzz smoke job.
name: infinity-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --all --check
      - name: dep-DAG law
        run: ./scripts/check-dep-dag.sh
      - name: cell deny-list
        run: ./scripts/check-cell-denylist.sh
      - name: fault-point inventory (M2-S16)
        run: ./scripts/check-fault-points.sh
      - name: fsync fail-stop grep (M2-S17, §8.4)
        run: ./scripts/check-fsync-fail-stop.sh
      - name: panic-policy grep (M2.5-S13)
        run: ./scripts/check-panic-policy.sh
      - name: SAFETY.md inventory (M2.5-S16, §17.3)
        run: ./scripts/check-safety-inventory.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  miri:
    # Scoped to the unsafe leaf crates (verification ladder §17.2).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: miri (inf-alloc, inf-fabric)
        run: cargo +nightly miri test -p inf-alloc -p inf-fabric
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  loom:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: loom model (SPSC ring)
        run: cargo test -p inf-fabric --release loom_ -- --nocapture
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  fuzz-smoke:
    # 10-minute smoke per PR (M0-S02); 1 h corpus run is the nightly job.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz RESP parser (smoke)
        run: cargo +nightly fuzz run resp_parse -- -max_total_time=300
        working-directory: crates/inf-wire
      - name: fuzz fabric codec (smoke)
        run: cargo +nightly fuzz run fabric_codec -- -max_total_time=300
        working-directory: crates/inf-fabric
      - name: fuzz glob matcher (smoke, M1 §5)
        run: cargo +nightly fuzz run glob_match -- -max_total_time=300
        working-directory: crates/inf-server
      - name: fuzz SCAN cursor (smoke, M1 §5)
        run: cargo +nightly fuzz run scan_cursor -- -max_total_time=300
        working-directory: crates/inf-server
      - name: fuzz log frame decoder (smoke, M2-S01)
        run: cargo +nightly fuzz run frame_decode -- -max_total_time=300
        working-directory: crates/inf-log
      - name: fuzz segment reader (smoke, M2-S04)
        run: cargo +nightly fuzz run segment_read -- -max_total_time=300
        working-directory: crates/inf-log
      - name: fuzz .ick loader (smoke, M2-S10)
        run: cargo +nightly fuzz run ick_decode -- -max_total_time=300
        working-directory: crates/inf-log
      - name: fuzz idoc decoder (smoke, M3-S01/S02)
        run: cargo +nightly fuzz run idoc_decode -- -max_total_time=300
        working-directory: crates/inf-doc
      - name: fuzz JSON parser (smoke, M3-S05; seeded from the committed
          minimized corpus, M3-S07)
        run: cargo +nightly fuzz run json_parse fuzz/corpus/json_parse fuzz/corpora/json -- -max_total_time=300
        working-directory: crates/inf-doc
      - name: fuzz path programs (smoke, M3-S08/S09; seeded from the
          pinned child-len-overflow regression)
        run: cargo +nightly fuzz run path_program fuzz/corpus/path_program fuzz/corpora/path_program -- -max_total_time=300
        working-directory: crates/inf-doc

  compat-diff:
    # M0-S15 AC: command x edge-case matrix byte-identical to real Redis.
    # M1-S14/M3-S21: core Redis and RedisJSON use separate pinned oracles;
    # version drift would silently move the compatibility claim. Harnesses
    # connect by explicit address instead of spawning from PATH.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: start pinned oracle (redis 8.0.5, debug commands on, no persistence)
        run: |
          docker run -d --name oracle -p 6390:6379 redis:8.0.5 \
            redis-server --save '' --appendonly no --enable-debug-command yes
          for i in $(seq 1 100); do
            (echo PING | timeout 1 nc 127.0.0.1 6390 | grep -q PONG) && break || sleep 0.2
          done
      - name: start pinned RedisJSON oracle (Redis Stack 7.4.0-v8, ReJSON 2.8.9)
        run: |
          docker run -d --name json-oracle -p 6391:6379 \
            -e REDIS_ARGS="--save '' --appendonly no" \
            redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
          for i in $(seq 1 100); do
            oracle_info=$(printf 'INFO MODULES\r\n' | timeout 1 nc 127.0.0.1 6391 || true)
            if grep -q 'module:name=ReJSON' <<<"$oracle_info" && grep -q 'ver=20809' <<<"$oracle_info"; then
              break
            fi
            sleep 0.2
          done
          grep -q 'module:name=ReJSON' <<<"$oracle_info"
          grep -q 'ver=20809' <<<"$oracle_info"
      - name: compat-diff matrix + generated-matrix staleness gate
        run: cargo test -p compat -- --nocapture
        env:
          INF_COMPAT_ORACLE_ADDR: 127.0.0.1:6390
          INF_COMPAT_JSON_ORACLE_ADDR: 127.0.0.1:6391

  client-smoke:
    # M1-S03/S14 AC: major Redis client libraries work against infinityd out
    # of the box (INFO fields, CLIENT surface, pub/sub, SCAN). One job per
    # library would waste runners; one server serves all four sequentially.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: build infinityd (release)
        run: cargo build --release -p infinityd
      - name: start infinityd
        # infinityd speaks RESP arrays only (no inline commands), so the
        # probe sends real RESP bytes — `echo PING | nc` never gets a PONG
        # and silently burned the full retry budget. The loop now also
        # hard-fails if the server never comes up instead of letting the
        # smokes run against a dead port.
        run: |
          ./target/release/infinityd --port 6379 &
          ready=0
          for i in $(seq 1 100); do
            if printf '*1\r\n$4\r\nPING\r\n' | timeout 1 nc 127.0.0.1 6379 | grep -q PONG; then
              ready=1; break
            fi
            sleep 0.2
          done
          test "$ready" = 1 || { echo "infinityd never answered PING"; exit 1; }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Per-step timeouts: a client library with no command timeout parks
      # forever on a lost reply; bound each smoke to minutes, not the job.
      - name: redis-py smoke
        timeout-minutes: 5
        run: |
          pip install 'redis>=5,<7'
          python tests/client-smoke/smoke.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node-redis smoke
        timeout-minutes: 5
        run: |
          npm install --no-save redis@^4
          node smoke.mjs
        working-directory: tests/client-smoke
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: go-redis smoke
        timeout-minutes: 5
        run: go mod tidy && go run .
        working-directory: tests/client-smoke/go
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: lettuce smoke
        timeout-minutes: 10
        run: mvn -q -B compile exec:java -Dexec.mainClass=Smoke
        working-directory: tests/client-smoke/java

  sim-smoke:
    # M0-S20: deterministic simulator — smoke scenario twice with trace
    # comparison, plus the in-process determinism/oracle/planted-bug tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: sim tests (determinism, oracle, planted lost-wakeup)
        run: cargo test -p inf-sim
      - name: m0-smoke determinism (CLI)
        run: cargo run --release --bin inf-sim -- --scenario m0-smoke --seed 0xC0FFEE --verify-determinism

  kernel-matrix:
    # Asserts io_uring feature-probe fallback across kernels (M0-S02).
    # 5.15 (no multishot recv) / 6.1 / latest. Runners only provide their own
    # kernel; older-kernel behavior is exercised via probe-forcing env vars
    # until a self-hosted matrix box exists. PENDING LINUX VALIDATION.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: uring suite, probed features
        run: cargo test -p inf-runtime --features uring
      - name: uring suite, forced-degraded (oneshot recv, no provided buffers)
        run: cargo test -p inf-runtime --features uring
        env:
          INF_URING_FORCE_DEGRADED: "1"
