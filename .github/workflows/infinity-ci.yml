# InfinityDB CI — fast pull-request lane (verification ladder, M0-S02).
#
# Layout: this repository's root IS the Cargo workspace (crates/, bins/,
# tests/ at the top level). Jobs run from the repo root; there is no nested
# `infinitydb/` directory on the runner.
#
# Split (2026-07-17): this workflow is the ~15-minute PR gate — the
# correctness-critical, fast jobs on Linux/x86_64. The slow / broad jobs
# (full 3-OS build matrix, full strict-provenance Miri, the 11-target fuzz
# smoke, client-smoke, kernel-matrix, benchmark compile-smoke) moved to
# `infinity-ci-full.yml`, run on demand after review with a `/ci-full` PR
# comment or the Actions "Run workflow" button. Rationale: run #9 spent
# 45 min in Miri (timed out) and ~42 min in the 11-target fuzz smoke;
# neither belongs on every push. compat-diff stays here — it is fast
# (~30 s) and guards the headline JSON-compat claim (C23).
name: infinity-ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: infinity-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  build-test:
    # Fast lane: Linux/x86_64 only. The ubuntu-arm + macos-15 legs (both
    # aarch64) run in infinity-ci-full — they catch arch-specific issues
    # (e.g. the inf-simd cfg(x86_64) tiers) that x86_64 cannot, at 3x the
    # runner cost, so they gate the merge, not every push.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all --check
      - name: dep-DAG law
        run: ./scripts/check-dep-dag.sh
      - name: cell deny-list
        run: ./scripts/check-cell-denylist.sh
      - name: fault-point inventory (M2-S16)
        run: ./scripts/check-fault-points.sh
      - name: fsync fail-stop grep (M2-S17, §8.4)
        run: ./scripts/check-fsync-fail-stop.sh
      - name: panic-policy grep (M2.5-S13)
        run: ./scripts/check-panic-policy.sh
      - name: SAFETY.md inventory (M2.5-S16, §17.3)
        run: ./scripts/check-safety-inventory.sh
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace

  cargo-deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml

  miri-canary:
    # Fast PR canary: strict-provenance Miri on the smallest unsafe leaf
    # (inf-alloc) only. The FULL Miri (inf-alloc + inf-fabric, all tests) is
    # the M0-S02 acceptance gate and runs in infinity-ci-full — that is the
    # job that was timing out at 45 min on PRs. If inf-alloc alone ever
    # approaches this budget, scope it further to specific tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - name: miri canary (inf-alloc, strict provenance)
        run: cargo +nightly miri test -p inf-alloc
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  loom:
    # SPSC ring model — required for inf-fabric PRs (AGENTS.md). Small model,
    # ~1 min in practice (run #9: 57 s); kept on the PR lane.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: loom model (SPSC ring)
        run: cargo test -p inf-fabric --release loom_ -- --nocapture
        env:
          RUSTFLAGS: --cfg loom
          LOOM_MAX_PREEMPTIONS: "3"

  sim-smoke:
    # M0-S20: deterministic simulator — smoke scenario twice with trace
    # comparison, plus the in-process determinism/oracle/planted-bug tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: sim tests (determinism, oracle, planted lost-wakeup)
        run: cargo test -p inf-sim
      - name: m0-smoke determinism (CLI)
        run: cargo run --release --bin inf-sim -- --scenario m0-smoke --seed 0xC0FFEE --verify-determinism

  fuzz-smoke:
    # PR canary: one decoder, 60 s, to catch gross breakage fast. cargo-fuzz
    # auto-creates fuzz/corpus/resp_parse, so no seed dir is needed here. The
    # full 11-target smoke (300 s each, ~42 min) runs in infinity-ci-full.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: fuzz RESP parser (60 s smoke)
        run: cargo +nightly fuzz run resp_parse -- -max_total_time=60
        working-directory: crates/inf-wire

  compat-diff:
    # M0-S15 / M1-S14 / M3-S21: declared command x edge-case matrix
    # byte-identical to pinned Redis + RedisJSON oracles. Fast (~30 s) and
    # guards C23, so it stays on the PR lane. Harnesses connect by explicit
    # address instead of spawning from PATH.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: start pinned oracle (redis 8.0.5, debug commands on, no persistence)
        run: |
          docker run -d --name oracle -p 6390:6379 redis:8.0.5 \
            redis-server --save '' --appendonly no --enable-debug-command yes
          for i in $(seq 1 100); do
            (echo PING | timeout 1 nc 127.0.0.1 6390 | grep -q PONG) && break || sleep 0.2
          done
      - name: start pinned RedisJSON oracle (Redis Stack 7.4.0-v8, ReJSON 2.8.9)
        run: |
          docker run -d --name json-oracle -p 6391:6379 \
            -e REDIS_ARGS="--save '' --appendonly no" \
            redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
          for i in $(seq 1 100); do
            oracle_info=$(printf 'INFO MODULES\r\n' | timeout 1 nc 127.0.0.1 6391 || true)
            if grep -q 'module:name=ReJSON' <<<"$oracle_info" && grep -q 'ver=20809' <<<"$oracle_info"; then
              break
            fi
            sleep 0.2
          done
          grep -q 'module:name=ReJSON' <<<"$oracle_info"
          grep -q 'ver=20809' <<<"$oracle_info"
      - name: compat-diff matrix + generated-matrix staleness gate
        run: cargo test -p compat -- --nocapture
        env:
          INF_COMPAT_ORACLE_ADDR: 127.0.0.1:6390
          INF_COMPAT_JSON_ORACLE_ADDR: 127.0.0.1:6391
