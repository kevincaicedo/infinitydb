# InfinityDB CI — heavy suite (main, weekly, and on demand).
#
# Runs the suites past a PR lane's budget: the full strict-provenance Miri
# (inf-alloc + inf-fabric), longer than a PR job's timeout, and the fuzz smoke
# (every fuzz target for 300 s, one job a target), more runners than a PR run
# should hold; and benchmark correctness/compile sanity. Everything else (3-OS
# build matrix, client-smoke, compat-diff, kernel-matrix, loom, sim-smoke)
# stays on the fast PR lane in infinity-ci.yml, where it costs little.
#
# Triggers:
#   • push to main — verify the merged commit.
#   • schedule — Mondays at 07:23 UTC, on the default branch.
#   • pull_request labeled `ci-full` — add the label to a PR to run the suite.
#     `pull_request` uses the workflow file from the PR branch, so this path
#     works before this file is on `main`.
#   • issue_comment `/ci-full` on a PR, from a maintainer (author_association
#     OWNER / MEMBER / COLLABORATOR). GitHub loads comment-triggered workflows
#     from the DEFAULT branch, so `/ci-full` (and the "Run workflow" button)
#     activate only once this file is merged to `main`.
#   • workflow_dispatch — the Actions "Run workflow" button (also requires the
#     file on `main`).
#
# Real benchmark *numbers* never come from CI (shared runners; L10). The
# bench job tests and compiles; gate numbers come from the reference-box campaign
# (inf-bench gate-run --reference-box, inf-compare).
name: infinity-ci-full

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  pull_request:
    types: [labeled] # add the `ci-full` label to run the suite on a PR
  issue_comment:
    types: [created]

concurrency:
  # Every automatic run completes independently of later pushes and PR requests.
  group: infinity-ci-full-${{ github.event_name }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  authorize:
    # Gate the suite, acknowledge the command, and resolve the commit to test.
    #   - push to main / schedule: tests the event SHA.
    #   - workflow_dispatch: always runs, tests the dispatched branch head.
    #   - pull_request labeled `ci-full`: tests the PR head SHA.
    #   - issue_comment `/ci-full` on a PR from a maintainer: tests the PR head.
    #   - anything else (random label / comment): the `if` is false, so this
    #     job and every job that `needs` it is skipped — no runner is spent.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ci-full') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '/ci-full') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: acknowledge the /ci-full command
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket',
            });
      - name: resolve commit to test
        id: resolve
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'issue_comment') {
              const pr = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });
              core.setOutput('sha', pr.data.head.sha);
            } else if (context.eventName === 'pull_request') {
              core.setOutput('sha', context.payload.pull_request.head.sha);
            } else {
              core.setOutput('sha', context.sha);
            }

  miri:
    # The full strict-provenance Miri: inf-alloc and inf-fabric, every test.
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          # `cargo miri setup` rebuilds a Miri-instrumented std into
          # ~/.cache/miri, which rust-cache does not cover by default.
          cache-directories: "~/.cache/miri"
          key: miri-full
      - name: miri (inf-alloc, inf-fabric) strict provenance
        run: cargo +nightly miri test -p inf-alloc -p inf-fabric
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
      # The cell executor's waker is sound on any thread (ADR-0003 A1): its executor, cross-thread
      # and drop tests, each with the leak check on.
      - name: miri (inf-runtime's executor and waker tests) strict provenance
        run: cargo +nightly miri test -p inf-runtime --test executor --test waker_threads --test waker_close
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  fuzz-targets:
    # The fuzz smoke's matrix: every target the fuzz manifests list, with its
    # committed seed directories, read from the census at the commit under
    # test (ADR-0198 D3). A red census fails this step before its output is
    # written, so no smoke job runs on a partial list, and the census never
    # prints an empty one.
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.census.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - name: the fuzz targets, from the census
        id: census
        shell: bash
        run: |
          matrix=$(./scripts/check-fuzz-targets.sh --matrix smoke)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz-smoke:
    # Every fuzz target for 300 s, one job a target, the nightly's step with a
    # shorter time (ADR-0198 D3). cargo-fuzz creates its default corpus
    # directory but refuses a named one that is missing, and a target's
    # working corpus, fuzz/corpus/<target>, is committed for some targets and
    # absent from a fresh checkout for the rest, so the job creates it before
    # the run names it beside the target's seed directories. Each job is
    # named by its target, unique across the tree, rather than by every
    # matrix value.
    name: fuzz-smoke ${{ matrix.target }}
    needs: [authorize, fuzz-targets]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.fuzz-targets.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: ensure corpus dir exists
        run: mkdir -p fuzz/corpus/${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
      - name: "fuzz ${{ matrix.target }} (300 s)"
        run: cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} ${{ matrix.seeds }} -- -max_total_time=300
        working-directory: ${{ matrix.dir }}
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-artifacts-${{ matrix.target }}
          path: ${{ matrix.dir }}/fuzz/artifacts/
          if-no-files-found: ignore

  bench-build:
    # Benchmark sanity — release instrument tests and compilation, also on PRs.
    # NO measurements: CI runners never
    # back a number (L10). Real gate numbers come from the reference
    # box (inf-bench gate-run --reference-box, inf-compare).
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.authorize.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: benchmark instrument tests (release)
        run: cargo test --release -p inf-bench -p inf-compare
      - name: campaign harnesses build (release)
        run: cargo build --release -p inf-bench -p inf-compare -p inf-sim --features inf-sim/dst
      - name: criterion benches compile (no run)
        run: cargo bench --workspace --no-run

  report:
    # Post the outcome back to the PR when invoked via /ci-full or the label.
    needs: [authorize, miri, fuzz-targets, fuzz-smoke, bench-build]
    if: always() && needs.authorize.result != 'skipped' && (github.event_name == 'issue_comment' || github.event_name == 'pull_request')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const r = ${{ toJSON(needs) }};
            const order = ['miri', 'fuzz-targets', 'fuzz-smoke', 'bench-build'];
            const icon = s => s === 'success' ? '✅' : s === 'skipped' ? '⏭️' : '❌';
            const lines = order.map(k => `- ${icon(r[k] && r[k].result)} ${k}: ${r[k] ? r[k].result : 'n/a'}`);
            const anyFail = order.some(k => r[k] && r[k].result !== 'success' && r[k].result !== 'skipped');
            const prNumber = context.issue.number || context.payload.pull_request.number;
            const body = [
              `### infinity-ci-full ${anyFail ? '❌ failed' : '✅ passed'}`,
              '',
              ...lines,
              '',
              `[Full run log](${url})`,
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
