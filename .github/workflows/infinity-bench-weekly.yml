# InfinityDB weekly pressure-row campaign (M1 §5: "new pressure rows in
# CI-bench — reduced, reference box weekly").
#
# REQUIRES a self-hosted runner labeled `reference-box` (the M0-R2 box:
# pinned cores, performance governor, redis-server 8.x installed). The rows
# are meaningless on shared GitHub runners (L10), so the campaign job never
# falls back to one — it simply does not run until the box is registered.
#
# ARMING SWITCH (2026-08-08). The job is gated on the repository variable
# `REFERENCE_BOX_ONLINE`. Unset, the weekly schedule fires, reports that the
# campaign is disarmed, and exits green in seconds.
#
#   Before: every Monday's `pressure-rows` sat in the queue with no runner
#   able to accept it until GitHub killed it at the 24 h limit — one red
#   "exceeded the maximum execution time while awaiting a runner" annotation
#   per week (run #8), which is noise, not honesty. `timeout-minutes` does
#   not bound queue time, so only a guard can prevent this.
#
#   To arm, once the reference-box runner is registered and online:
#       gh variable set REFERENCE_BOX_ONLINE --body 1
#   (or Settings → Secrets and variables → Actions → Variables). The weekly
#   cadence then resumes with no further edit to this file. To disarm again
#   (box down for maintenance), delete the variable or set it to 0.
#
# `workflow_dispatch` accepts a `force` input that bypasses the guard, for
# the case where the runner is online but the variable has not been set yet.
# A forced run with no runner present WILL queue for 24 h — that is the
# deliberate override, not the default.
name: infinity-bench-weekly

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if REFERENCE_BOX_ONLINE is unset (queues 24 h if no reference-box runner accepts it)"
        type: boolean
        default: false

jobs:
  preflight:
    # Always runs, on a shared runner, in seconds: makes the weekly run's
    # status legible instead of leaving an opaque skipped job behind.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      armed: ${{ steps.gate.outputs.armed }}
    steps:
      - id: gate
        run: |
          if [ "${{ vars.REFERENCE_BOX_ONLINE }}" = "1" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "armed=true" >> "$GITHUB_OUTPUT"
            echo "reference-box campaign ARMED (REFERENCE_BOX_ONLINE=${{ vars.REFERENCE_BOX_ONLINE }}, force=${{ inputs.force }})" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "armed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Weekly pressure-row campaign: DISARMED"
              echo
              echo "No \`reference-box\` self-hosted runner is declared online, so the"
              echo "campaign did not run. Binding rows require the M0-R2 box (pinned"
              echo "cores, performance governor, redis-server 8.x) — a shared GitHub"
              echo "runner cannot produce them (L10), and queueing for one that does"
              echo "not exist just burns the 24 h runner-wait limit."
              echo
              echo "Arm with: \`gh variable set REFERENCE_BOX_ONLINE --body 1\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  pressure-rows:
    needs: preflight
    if: needs.preflight.outputs.armed == 'true'
    runs-on: [self-hosted, reference-box]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - name: build
        run: cargo build --release -p infinityd -p inf-bench
      - name: reduced pressure-row campaign (binding tier)
        # Full-size gate campaign sizes (50M-key FLUSHALL row, 10M fill,
        # 100k subscriptions) are the milestone-verdict run, executed
        # manually per M1-S17; the weekly keeps a reduced regression watch.
        run: |
          ./target/release/inf-bench gate-run m1 --reference-box \
            --duration 10 --replicates 3 \
            --storm-keys 1000000 --flushall-keys 5000000 --fill-keys 10000000 \
            --maxmemory-mb 1024 --subs 2000 --sub-channels 50
      - name: build inf-compare
        run: cargo build --release -p inf-compare
      - name: reduced inf-compare sweep (M2.5-S22, ADR-0025 D3)
        # The standing comparative instrument beside the in-house rows:
        # the reduced workload set (set/get/mixed/memory), all present
        # engines, both generators — the weekly signal between full
        # campaigns. Requires redis-server, dragonfly, and
        # memtier_benchmark on the runner (the reference-box profile).
        run: |
          ./target/release/inf-compare run --reference-box \
            --workload set,get,mixed,memory --pipeline 1,16 \
            --duration 15 --out .artifacts/compare
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-gate-report
          path: |
            .artifacts/m1/*-gate-run/report.md
            .artifacts/compare/*/report.md
