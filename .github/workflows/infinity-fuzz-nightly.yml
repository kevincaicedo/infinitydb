# Nightly fuzz campaign: every fuzz target the fuzz manifests list, each on a
# runner of its own for 19,800 s (5.5 h), the targets read from the census
# when the run starts (ADR-0198 D3), so a new target is fuzzed from its first
# night. GitHub ends a job at 6 h of wall time with checkout, toolchain,
# cargo-fuzz install and the fuzz build counted in it, so 6 h of fuzzing would
# be cut mid-run and bank no hours; 19,800 s leaves that setup its room, and a
# target accrues 24 h in five nights. A crash uploads its reproducing input;
# its fix lands with that input minimized into the target's corpus.
#
# NOTE: the repo root is the Cargo workspace; jobs run from the root.
name: infinity-fuzz-nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    # The matrix: every target with its committed seed directories, from the
    # census. A red census fails this step before its output is written, so
    # no fuzz job runs on a partial list, and the census never prints an
    # empty one.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.census.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - name: the fuzz targets, from the census
        id: census
        shell: bash
        run: |
          matrix=$(./scripts/check-fuzz-targets.sh --matrix nightly)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  fuzz-hour:
    # Named by its target, unique across the tree, rather than by every
    # matrix value.
    name: fuzz-hour ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # cargo-fuzz creates its default corpus directory but refuses a named
      # one that is missing, and a target's working corpus,
      # fuzz/corpus/<target>, is committed for some targets and absent from a
      # fresh checkout for the rest: the job restores the previous night's
      # corpus, then creates the directory when no night left one.
      - name: restore corpus from previous nights
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: ensure corpus dir exists
        run: mkdir -p fuzz/corpus/${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
      - name: "fuzz ${{ matrix.target }} (5.5 h)"
        run: cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} ${{ matrix.seeds }} -- -max_total_time=19800
        working-directory: ${{ matrix.dir }}
      # Save even when the job fails: a crash night is exactly the corpus
      # worth keeping — the input that found the crash is in it.
      - name: save corpus for the next night
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ matrix.dir }}/fuzz/artifacts/
          if-no-files-found: ignore
