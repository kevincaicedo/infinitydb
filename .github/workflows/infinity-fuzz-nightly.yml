# Nightly fuzz campaign per decoder (M0-S02 promised it; M2-S01 makes it
# an AC for the log frame decoder). Each target runs on its own runner; a
# crash uploads the reproducing artifact — fixes land WITH the input
# minimized into the target's corpus.
#
# Per-target budget: 5.5 h (owner decision 2026-08-08, v0.4.0 readiness
# §9 D4 — max out the runner). GitHub hard-kills jobs at 6 h wall
# including checkout/toolchain/cargo-install/fuzz-build overhead, so a
# literal 6 h of fuzz time would be killed mid-run and bank nothing;
# 5.5 h + overhead fits. The 24 h/target release gate accrues in 5
# nights (4 nights + a workflow_dispatch top-up also works).
#
# NOTE: the repo root is the Cargo workspace; jobs run from the root.
name: infinity-fuzz-nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz-hour:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: crates/inf-wire, target: resp_parse }
          - { dir: crates/inf-fabric, target: fabric_codec }
          - { dir: crates/inf-server, target: glob_match }
          - { dir: crates/inf-server, target: scan_cursor }
          # Seeds the pinned first_lsn-offset-ceiling regression (this target
          # found it on the 08-17 night; ADR-0072, readiness F35).
          - { dir: crates/inf-log, target: frame_decode, seeds: fuzz/corpora/frame_decode }
          - { dir: crates/inf-log, target: segment_read }
          - { dir: crates/inf-log, target: ick_decode }
          # M2/M4 on-disk decoders (readiness F2: targets existed, nightly
          # accrual was not wired — L9 requires the hours, not the file).
          - { dir: crates/inf-log, target: manifest_decode }
          - { dir: crates/inf-log, target: extent_decode }
          # M4-S11 tier-file decoder — the M4 §6 plan requires it nightly.
          - { dir: crates/inf-log, target: fuzz_tierfile_decode }
          # M3-S01/S02 (gap caught in S05: the S02 ledger recorded this
          # accrual but the matrix was never extended) + M3-S05.
          - { dir: crates/inf-doc, target: idoc_decode }
          # json_parse seeds from the committed minimized corpus (M3-S07)
          # so nightly hours never restart coverage from zero.
          - { dir: crates/inf-doc, target: json_parse, seeds: fuzz/corpora/json }
          # M3-S08/S09: path text parser + program-byte decoder (ADR-0040).
          # Seeds the pinned child-len-overflow regression (caught by this
          # target at 300 s, fixed same session).
          - { dir: crates/inf-doc, target: path_program, seeds: fuzz/corpora/path_program }
          # M3 delta-apply decoder (readiness F2).
          - { dir: crates/inf-doc, target: fuzz_delta_apply }
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - name: install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # cargo-fuzz auto-creates the DEFAULT corpus dir but hard-errors on an
      # explicitly named one that is missing ("The required directory ...
      # does not exist"). Only 3 of the 14 working corpora are committed
      # (manifest_decode, extent_decode, fuzz_tierfile_decode); the rest are
      # gitignored, so on a fresh checkout those 11 jobs died at startup and
      # banked ZERO hours from the day the arg landed (2026-08-06) until
      # this fix (2026-08-13) — the 24 h/target release clock for them
      # starts tonight. Restore the previous night's grown corpus first,
      # then mkdir -p for the cache-miss / first-night case (the same
      # pattern infinity-ci-full.yml already uses).
      - name: restore corpus from previous nights
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: ensure corpus dir exists
        run: mkdir -p fuzz/corpus/${{ matrix.target }}
        working-directory: ${{ matrix.dir }}
      - name: "fuzz ${{ matrix.target }} (5.5 h)"
        run: cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} ${{ matrix.seeds }} -- -max_total_time=19800
        working-directory: ${{ matrix.dir }}
      # Save even when the job fails: a crash night is exactly the corpus
      # worth keeping — the input that found the crash is in it.
      - name: save corpus for the next night
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.dir }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ matrix.dir }}/fuzz/artifacts/
          if-no-files-found: ignore
