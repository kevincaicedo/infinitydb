schema = "infinitydb.m2.crash-matrix.v1"
milestone = "M2-S17"
status = "partial-runner"

fault_points = [
    "log_append_short_write",
    "torn_frame",
    "fsync_err",
    "manifest_rename_fail",
    "power_cut_after_manifest",
    "dir_fsync_fail",
    "checkpoint_write_enospc",
    "power_cut_after_seal",
]

fsync_policies = [
    "everysec",
    "always",
]

[[workload_shapes]]
name = "single_write"
description = "one durable namespace write followed by crash and recovery"
oracle = "recovered state matches the acked-write contract for the selected fsync policy"

[[workload_shapes]]
name = "batched_pipeline"
description = "multiple durable writes coalesced into one LOG iteration"
oracle = "acked writes survive, unacked writes do not leak past the policy watermark"

[[workload_shapes]]
name = "restart_watermark"
description = "a durable prefix followed by a failed later batch and restart"
oracle = "restart recovers exactly the durable prefix watermark: prior acked writes survive and failed-batch writes remain absent"

[[workload_shapes]]
name = "segment_recovery"
description = "writes around segment tail, seal, and recovered writer bootstrap"
oracle = "recovery reaches a valid frame boundary and state digest matches reference replay"

[[workload_shapes]]
name = "checkpoint_tail"
description = "checkpoint image plus MANIFEST publication followed by tail replay"
oracle = "checkpoint image state and post-checkpoint tail state survive while pre-checkpoint-only log state is skipped"

[[workload_shapes]]
name = "live_checkpoint_command"
description = "public INF.CKPT WAIT command path with live checkpoint image and MANIFEST publication"
oracle = "WAIT replies only after MANIFEST durability; a failed live MANIFEST publish fail-stops before any reply and recovery falls back to the complete log"

[[workload_shapes]]
name = "manifest_replacement"
description = "already-published MANIFEST followed by a failed newer MANIFEST replacement"
oracle = "old durable MANIFEST remains the recovery root, its tail is replayed, and partial-new checkpoint image state is ignored"

[[workload_shapes]]
name = "public_recovered_state_sweep"
description = "shardable public RESP workload sweep with simulated power cuts and recovery digests"
oracle = "the checked CI-sized sweep manifest matches the public recovered-state oracle; 10k gate-scale artifacts run in the nightly S19 fleet"

[[workload_shapes]]
name = "public_everysec_workload_sweep"
description = "shardable public everysec multi-write workload with timer-fsynced prefix and loss-window suffix"
oracle = "the checked CI-sized sweep recovers a valid prefix at or after the timer-fsynced boundary and fully recovers after timer fsync"

[[fault_coverage]]
fault_point = "log_append_short_write"
status = "runner-covered"
test = "inf-sim::net::tests::public_log_append_write_fault_fail_stop"
notes = "public runner row injects EIO into the current FileWriteAt terminal-error path, fail-stops before ACK, and recovers the pre-batch state; kernel short-write retry remains S17 work until BackendDriver exposes partial-write progress"

[[fault_coverage]]
fault_point = "torn_frame"
status = "unit-covered"
test = "inf-server::log_bootstrap::tests::recovered_data_root_bootstrap_torn_frame_fault_truncates_bad_crc_final_frame"
notes = "recovered active-tail bad-CRC final-frame path truncates to the last complete frame"

[[fault_coverage]]
fault_point = "fsync_err"
status = "unit-covered"
test = "inf-server::log_writer::tests::fsync_err_fault_is_fatal_before_frame_is_durable"
notes = "writer returns SyncQueued before fdatasync, then fsync_err returns fatal Fsync; live plane fail-stop is unit-tested and public runner rows now cover zero-watermark replay, non-zero previous-watermark replay, and process non-zero exit, while the full process matrix remains S17 work"

[[fault_coverage]]
fault_point = "manifest_rename_fail"
status = "unit-covered"
test = "inf-server::manifest::tests::manifest_rename_fail_fault_is_typed_before_directory_sync"
notes = "real MANIFEST publish path covers rename failure before directory fsync; public runner rows now prove a failed first-publish MANIFEST rename falls back to full-log replay and failed replacement MANIFEST rename preserves the old durable MANIFEST"

[[fault_coverage]]
fault_point = "power_cut_after_manifest"
status = "runner-covered"
test = "inf-sim::net::tests::m2_crash_matrix_cli_runner_manifest_is_deterministic"
notes = "public checkpoint-tail row power-cuts after checkpoint image and MANIFEST directory fsync, then recovers through the production MANIFEST bootstrap; pre-MANIFEST swap failures and full cartesian rows remain S17 work"

[[fault_coverage]]
fault_point = "dir_fsync_fail"
status = "unit-covered"
test = "inf-server::log_bootstrap::tests::first_boot_layout_dir_fsync_fault_is_typed_error"
notes = "first-boot directory sync failure returns a typed non-success error before durable layout claim; public runner rows now prove failed first-publish MANIFEST directory fsync falls back to full-log replay, failed replacement MANIFEST directory fsync preserves the old durable MANIFEST, and live INF.CKPT WAIT fail-stops before reply on final MANIFEST dir-fsync EIO"

[[fault_coverage]]
fault_point = "checkpoint_write_enospc"
status = "runner-covered"
test = "inf-sim::net::tests::m2_crash_matrix_cli_runner_manifest_is_deterministic"
notes = "public runner row injects ENOSPC into checkpoint image temp writes, returns a typed publish error before MANIFEST replacement, and recovers through the old durable MANIFEST; full cartesian rows remain M2-S17 work"

[[fault_coverage]]
fault_point = "power_cut_after_seal"
status = "runner-covered"
test = "inf-sim::net::tests::public_power_cut_after_non_exact_seal_recovers_truncated_segment"
notes = "public runner rows cover exact-fill segment seal and non-exact truncate-before-rotate through a MAINTAIN-preallocated segment 1, then power-cut and recover through the production two-segment replay path"

[[recovery_path_coverage]]
path = "torn_final_frame"
fault_point = "torn_frame"
workload = "segment_recovery"
status = "runner-covered"
test = "inf-sim::net::tests::public_torn_final_frame_recovers_stable_prefix"
oracle = "bad-CRC final frame recovers by positioning the writer at the last complete frame while replaying only the stable prefix"
notes = "public runner row corrupts the final frame trailer in the deterministic sim disk image, power-cuts, and recovers through production active-tail replay"

[[recovery_path_coverage]]
path = "active_tail_later_magic"
fault_point = "torn_frame"
workload = "segment_recovery"
status = "runner-covered"
