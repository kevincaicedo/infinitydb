# ---- M4.5-S34 write-through (FUA-class) frames on Direct segments
# (ADR-0086 D8) — sim-disk physics, carried by tests/fua.rs ----
#   fua-in-flight     — the cut lands with a write-through frame issued
#                       but not executed: every acked key recovers
#                       exactly, the in-flight frame and after are gone,
#                       the tail reopens Direct at the aligned boundary
#   seal-flush-x-fua  — a rotation's seal FLUSH never completes while a
#                       write-through frame in the new segment does: the
#                       done-prefix keeps it un-acked; recovery admits
#                       either outcome for it and every acked key exactly

[[row]]
point = "torn_frame"
tier = "node"
test = "crash-matrix::fua::fua_in_flight_loses_only_the_unacked_frame"
expect = "fua-in-flight"

