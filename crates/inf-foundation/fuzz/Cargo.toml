# cargo-fuzz crate for inf-foundation: the capped containers' op sequences
# against std models (ADR-0151 D6; 300 s per slice, nightly hours). Standalone
# workspace — built only by `cargo +nightly fuzz`.
[package]
name = "inf-foundation-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
# `fault-points` compiles the slab's `place_generation_last` hook, which the
# slab runs use to reach each policy's last generation; this standalone
# workspace builds nothing that ships.
inf-foundation = { path = "..", features = ["fault-points"] }

[[bin]]
name = "bounded_ops"
path = "fuzz_targets/bounded_ops.rs"
test = false
doc = false
bench = false

[workspace]
