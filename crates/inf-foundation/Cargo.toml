[package]
name = "inf-foundation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# M2-S16 fault-point registry. OFF in every shipping build — test builds
# get it through dev-dependency feature unification; `fault::fire` is a
# constant `false` without it (zero cost, A/B-verified).
fault-points = []
# ADR-0094 D3: the S37 collision oracle as a hasher mode — a 48-byte key
# under the `{shadow-collide}` hashtag hashes its first 32 bytes only, so
# the store suite and the simulators can build two real keys with one
# hash through the real paths. OFF in every shipping build (SipHash-1-3
# under a secret has no constructible collision — that is the point).
collision-oracle = []

[lints]
workspace = true

[[bench]]
name = "fault_fire"
harness = false
test = false

[[bench]]
name = "key_hash"
harness = false
test = false
