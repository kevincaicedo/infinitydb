# cargo-fuzz crate for inf-query (M4.5-S07 AC: predicate-program
# decoder fuzz, same-PR L9 rule — CI smoke + nightly hour). Standalone
# workspace — built only by `cargo +nightly fuzz`.
[package]
name = "inf-query-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inf-query = { path = ".." }
# Evaluation-corpus documents for the S08 evaluator lane.
inf-doc = { path = "../../inf-doc" }
# Catalog fixture types for the S09 compiler lane.
inf-store = { path = "../../inf-store" }

[[bin]]
name = "fuzz_predicate_program"
path = "fuzz_targets/fuzz_predicate_program.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_partiql_parse"
path = "fuzz_targets/fuzz_partiql_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_access_program"
path = "fuzz_targets/fuzz_access_program.rs"
test = false
doc = false
bench = false

[workspace]
