# cargo-fuzz crate for inf-server (SCAN cursor decoder +
# glob pattern matcher — the classic Redis CVE surface). A workspace of its
# own, outside the root's, so its fuzzing features never unify into a
# shipping build; `just check` compiles its targets on the pinned toolchain
# and `cargo +nightly fuzz` runs them.
[package]
name = "inf-server-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inf-server = { path = ".." }
inf-store = { path = "../../inf-store" }
inf-foundation = { path = "../../inf-foundation" }
inf-wire = { path = "../../inf-wire" }

[[bin]]
name = "glob_match"
path = "fuzz_targets/glob_match.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scan_cursor"
path = "fuzz_targets/scan_cursor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "command_surface"
path = "fuzz_targets/command_surface.rs"
test = false
doc = false
bench = false

[workspace]

[[bin]]
name = "move_snapshot"
path = "fuzz_targets/move_snapshot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "scatter_replies"
path = "fuzz_targets/scatter_replies.rs"
test = false
doc = false
bench = false

[[bin]]
name = "process_stat"
path = "fuzz_targets/process_stat.rs"
test = false
doc = false
bench = false
