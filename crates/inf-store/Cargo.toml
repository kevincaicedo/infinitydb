[package]
name = "inf-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Per-cell records, index, string ops, slot routing"

[dependencies]
inf-foundation.workspace = true
inf-alloc.workspace = true
inf-simd.workspace = true
inf-log.workspace = true
inf-doc = { workspace = true, optional = true }

[features]
# The document engine edge (ADR-0032 D7, ADR-0037 D7). Default-on; slim
# builds disable it and cannot construct or replay JsonDoc records.
default = ["doc"]
doc = ["dep:inf-doc"]
# Repeated-key interning experiment (M3-S04, ADR-0038) - default-off.
doc-intern-keys = ["doc", "inf-doc/doc-intern-keys"]

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "store"
harness = false
test = false

[[bench]]
name = "resolver"
harness = false
test = false

[[bench]]
name = "mutation"
harness = false
test = false

[[bench]]
name = "doc_ingest"
harness = false
test = false
required-features = ["doc"]

[[bench]]
name = "doc_durability"
harness = false
test = false
required-features = ["doc"]

[[bench]]
name = "doc_prefetch"
harness = false
test = false
required-features = ["doc"]

[lints]
workspace = true
