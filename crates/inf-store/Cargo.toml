[package]
name = "inf-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Per-cell records, index, string ops, slot routing"

[dependencies]
inf-foundation.workspace = true
inf-alloc.workspace = true
inf-simd.workspace = true
inf-log.workspace = true
inf-doc = { workspace = true, optional = true }

[features]
# The document engine edge (ADR-0032 D7, ADR-0037 D7). Default-on; slim
# builds disable it and cannot construct or replay JsonDoc records.
default = ["doc"]
doc = ["dep:inf-doc"]
# Repeated-key interning experiment (M3-S04, ADR-0038) - default-off.
doc-intern-keys = ["doc", "inf-doc/doc-intern-keys"]
# ADR-0094 D3: the collision oracle as a hasher mode (tests and the
# simulators only — never a shipping build; see inf-foundation).
collision-oracle = ["inf-foundation/collision-oracle"]

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
# statvfs for the M4-S15 endurance test's real-filesystem reclaim assert.
libc.workspace = true
# M4-S21: the `*_nospace` injection legs in `tiered_diskfull.rs` — the
# same dev-dependency feature unification the inf-log tests ride.
inf-foundation = { workspace = true, features = ["fault-points", "collision-oracle"] }

