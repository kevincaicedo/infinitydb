# cargo-fuzz crate for inf-store (M4.5-S02 AC: the typed index-key
# encoding is a durable contract and its decoder is L9 surface —
# `fuzz_index_key` lands in the same PR as the encoder, ADR-0074 D7;
# M4.5-S03 adds `fuzz_catalog` with the v3 index section, ADR-0075 D2;
# `tier_span_select`, the tier round's span selector against its
# prefix-sum oracle, ADR-0155 D6).
# A workspace of its own, outside the root's, so its fuzzing features never
# unify into a shipping build; `just check` compiles its targets on the
# pinned toolchain and `cargo +nightly fuzz` runs them.
[package]
name = "inf-store-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inf-store = { path = ".." }

[[bin]]
name = "fuzz_index_key"
path = "fuzz_targets/fuzz_index_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_catalog"
path = "fuzz_targets/fuzz_catalog.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_cold_key"
path = "fuzz_targets/fuzz_cold_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tier_span_select"
path = "fuzz_targets/tier_span_select.rs"
test = false
doc = false
bench = false

[workspace]
