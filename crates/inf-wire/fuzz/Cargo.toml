# cargo-fuzz crate for inf-wire (M0-S11 AC: parser fuzz, CI smoke + nightly
# hour). A workspace of its own, outside the root's, so its fuzzing features
# never unify into a shipping build; `just check` compiles its targets on the
# pinned toolchain and `cargo +nightly fuzz` runs them.
[package]
name = "inf-wire-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inf-wire = { path = ".." }

[[bin]]
name = "resp_parse"
path = "fuzz_targets/resp_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "resp_reply_frame"
path = "fuzz_targets/resp_reply_frame.rs"
test = false
doc = false
bench = false

[workspace]
