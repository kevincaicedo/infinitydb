# cargo-fuzz crate for inf-fabric (M0-S10 AC: decoder fuzz target wired into
# the CI fuzz job). A workspace of its own, outside the root's, so its fuzzing
# features never unify into a shipping build; `just check` compiles its
# targets on the pinned toolchain and `cargo +nightly fuzz` runs them.
[package]
name = "inf-fabric-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
inf-fabric = { path = ".." }

[[bin]]
name = "fabric_codec"
path = "fuzz_targets/fabric_codec.rs"
test = false
doc = false
bench = false

[workspace]
