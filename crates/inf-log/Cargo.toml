[package]
name = "inf-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
inf-foundation.workspace = true
inf-simd.workspace = true

[dev-dependencies]
# M2-S16: tests arm named fault points; the feature reaches this crate's
# lib through dev-dependency unification and never a shipping build.
inf-foundation = { workspace = true, features = ["fault-points"] }
proptest.workspace = true
criterion.workspace = true
# Test-harness edges only (ADR-0013 D2): the S05/S06 integration tests drive
# the real CellLoop/WatermarkGate against this crate's staging + rotor +
# group commit. The normal-dependency DAG is unchanged — inf-log and
# inf-runtime meet in the plane (inf-server from M2-S08).
inf-runtime.workspace = true
inf-alloc.workspace = true
libc.workspace = true

[[bench]]
name = "reader_seq"
harness = false
