[package]
name = "inf-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Cell runtime: backend drivers (io_uring/kqueue), executor, reactor loop"

[dependencies]
inf-foundation.workspace = true
inf-alloc.workspace = true
libc.workspace = true

# The only crate allowed to name io_uring symbols (docs/dep-dag.toml).
# Feature-gated: Linux CI runs `--features uring`; default builds stay
# backend-free so the workspace compiles on any host.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = { workspace = true, optional = true }

[features]
uring = ["dep:io-uring"]
# For the tripwires' A/B only: compiles the always-on tripwire counters out to
# prove they cost nothing; the iteration count stays, the cold turn's epoch
# (ADR-0181 A1.3). Never enabled in shipping builds.
no-tripwires = []
# The fabric gate's test hooks (ADR-0194 A2's word at the field's edge): a
# gate built with its holder slots at a chosen first generation, and its
# count of takes past the key's generation field. Off in every shipping
# build (scripts/check-shipping-features.sh); the simulator reaches it
# through `inf-server/fault-points`, `just check` through the `gate` test.
fault-points = ["inf-foundation/fault-points"]

[dev-dependencies]
# The timer set's last-generation tests reach the slab's test hook
# (`place_generation_last`); `fault-points` stays off every normal edge
# (scripts/check-shipping-features.sh).
inf-foundation = { workspace = true, features = ["fault-points"] }
proptest.workspace = true
criterion.workspace = true
# Conformance tests poke sockets (setsockopt) directly.
libc.workspace = true
# The capped containers' allocation census (tests/bounded_alloc.rs) counts
# through inf-alloc's allocator, so inf-foundation stays dependency-free.
inf-alloc = { workspace = true, features = ["test-counting-allocator"] }
# The integration tests cross store, log and alloc in one vertical path.
# Dev-only — tests may cross layers (dep-dag exemption).
inf-store.workspace = true
inf-log.workspace = true

[[bench]]
name = "executor"
harness = false
test = false

# The timers' A/B by instructions (ADR-0154 D5): the wheel's legs.
[[bench]]
name = "timer_ab"
harness = false
test = false

# The cold-read path's A/B by instructions (ADR-0181): the host's legs.
[[bench]]
name = "cold_path"
harness = false
test = false

# The waker's A/B by instructions (ADR-0003 A1.5): legs A, B and P, chosen by argument.
[[bench]]
name = "waker_ab"
harness = false
test = false

# The executor's A/B by instructions (ADR-0211): each row a task path of the
# cell executor, one binary, `--variant <leg>-<row> --ops <n>`.
[[bench]]
name = "executor_ab"
harness = false
test = false

# The io_uring echo gate (Linux + uring only; skipped without the feature).
[[bench]]
name = "uring_echo"
harness = false
test = false
required-features = ["uring"]

# Group commit on a real device: LogWrite + linked fdatasync rows with
# fsync latency histograms (dev tier; gate values bind on the reference box).
[[bench]]
name = "log_fsync"
harness = false
test = false
required-features = ["uring"]

[lints]
workspace = true

# The log's buffered vs O_DIRECT A/B (Linux + uring only).
[[bench]]
name = "log_io_tier"
harness = false
test = false
required-features = ["uring"]

# The tier file's I/O mode A/B (ADR-0054; Linux + uring only).
[[bench]]
name = "tier_io_mode"
harness = false
test = false
required-features = ["uring"]

# Cold-read shaping: the coalescing A/B and saturation (ADR-0055).
[[bench]]
name = "cold_shaping"
harness = false
test = false
required-features = ["uring"]

[[test]]
name = "accept_exhaustion"
path = "tests/accept_exhaustion.rs"
required-features = ["uring"]

[[test]]
name = "close_fd_reuse"
path = "tests/close_fd_reuse.rs"
required-features = ["uring"]

# The fabric key past its generation field: needs the gate's first-generation hook.
[[test]]
name = "gate"
required-features = ["fault-points"]
